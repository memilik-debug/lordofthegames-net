<!doctype html>
<html lang="tr">
<head>
    <!-- Google tag (gtag.js) -->

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lord of the Games — Promo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      background: #06060d;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      color: #f0f0f8;
    }
    #root { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Mute toggle + Volume -->
  <div id="audio-controls" style="position:fixed;top:20px;right:20px;z-index:1000;display:flex;align-items:center;gap:10px;background:rgba(13,13,26,0.85);border:1.5px solid rgba(255,255,255,0.18);border-radius:28px;padding:6px 12px 6px 8px;backdrop-filter:blur(10px);">
    <button id="mute-btn" aria-label="Sesi aç/kapat" style="width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:#f0f0f8;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">🔊</button>
    <input id="vol-slider" type="range" min="0" max="100" value="50" style="width:90px;accent-color:#ff4500;cursor:pointer;" aria-label="Ses seviyesi" />
  </div>

  <!-- Music: starts on first user gesture or autoplay if allowed -->
  <audio id="bg-music" src="audio/promo-music.mp3" preload="auto" loop></audio>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="animations.jsx"></script>
  <script type="text/babel" src="scenes.jsx"></script>
  <script type="text/babel" src="scenes-main.jsx"></script>
  <script type="text/babel">
    const App = () => (
      <Stage
        width={1920}
        height={1080}
        duration={30}
        background="#06060d"
        loop={true}
        autoplay={true}
        persistKey="lotg-promo"
      >
        <MasterScene />
      </Stage>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    const audio = document.getElementById('bg-music');
    const muteBtn = document.getElementById('mute-btn');
    const volSlider = document.getElementById('vol-slider');
    let userVol = 0.5;
    audio.volume = userVol;
    let muted = false;

    function tryPlay() {
      audio.play().catch(() => {
        const start = () => { audio.play(); window.removeEventListener('click', start); window.removeEventListener('keydown', start); };
        window.addEventListener('click', start, { once: true });
        window.addEventListener('keydown', start, { once: true });
      });
    }
    tryPlay();

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      muted = !muted;
      audio.muted = muted;
      muteBtn.textContent = muted ? '🔇' : '🔊';
    });

    volSlider.addEventListener('input', (e) => {
      userVol = parseInt(e.target.value, 10) / 100;
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) audio.pause();
      else if (!muted) audio.play().catch(()=>{});
    });

    window.addEventListener('message', (e) => {
      if (e.data === 'stop-music') { audio.pause(); audio.currentTime = 0; }
    });

    setInterval(() => {
      const t = audio.currentTime % 30;
      if (t > 28.5) audio.volume = Math.max(0, userVol * (1 - (t - 28.5) / 1.5));
      else if (t < 1.5) audio.volume = Math.min(userVol, userVol * (t / 1.5));
      else audio.volume = userVol;
    }, 100);
  </script>
</body>
</html>
