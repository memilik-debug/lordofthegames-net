        // HUD'u güncelle — skor, saat, istatistik, momentum, kulübe, olay akışı.
        // Saha düğümleri (oyuncu/top) BURADA değil, animasyon döngüsünde güncellenir.
        function updateMatchHud() {
            const s = gameState.sim;
            if (!document.getElementById('m-score')) return;
            const [ev, dep] = gameState.currentMatch;
            const sH = gameState.matchStats.home, sA = gameState.matchStats.away;

            document.getElementById('m-score').textContent = `${gameState.lastResult[0]} - ${gameState.lastResult[1]}`;
            document.getElementById('m-clock').textContent = `${gameState.matchMinute}' ${tx('Dakika')}`;

            const possH = Math.round(sH.possession);
            document.getElementById('m-poss-h').textContent = possH + '%';
            document.getElementById('m-poss-a').textContent = (100 - possH) + '%';
            document.getElementById('m-poss-bar-h').style.width = possH + '%';
            document.getElementById('m-poss-bar-a').style.width = (100 - possH) + '%';

            // Momentum: hangi takım baskı kuruyor (top konumu + son hakimiyet)
            if (s) {
                const ballAdv = s.ball.x; // 0=away baskısı, 100=home baskısı
                const mEl = document.getElementById('m-momentum');
                const pct = Math.max(8, Math.min(92, ballAdv));
                mEl.style.width = pct + '%';
                const lbl = document.getElementById('m-momentum-label');
                if (pct > 60) { lbl.textContent = ev.ad.split(' ')[0].toUpperCase() + ' ' + tx('BASKILI'); mEl.className = 'absolute top-0 bottom-0 bg-gradient-to-r from-emerald-500 to-emerald-300 transition-all duration-300'; }
                else if (pct < 40) { lbl.textContent = dep.ad.split(' ')[0].toUpperCase() + ' ' + tx('BASKILI'); mEl.className = 'absolute top-0 bottom-0 bg-gradient-to-r from-rose-500 to-rose-300 transition-all duration-300'; }
                else { lbl.textContent = tx('DENGELİ'); mEl.className = 'absolute top-0 bottom-0 bg-gradient-to-r from-slate-500 to-slate-300 transition-all duration-300'; }
            }

            document.getElementById('m-statgrid').innerHTML = [
                ['Şut', sH.shots, sA.shots],
                ['İsabet', sH.shotsOnTarget, sA.shotsOnTarget],
                ['xG', (sH.xg||0).toFixed(2), (sA.xg||0).toFixed(2)],
                ['Kurtarış', sH.saves, sA.saves],
                ['Korner', sH.corners, sA.corners],
                ['Ofsayt', sH.offsides || 0, sA.offsides || 0],
                ['Frikik', sH.freekicks || 0, sA.freekicks || 0],
                ['🟨/🟥', sH.yellows + '/' + sH.reds, sA.yellows + '/' + sA.reds]
            ].map(st => `
                <div class="bg-slate-900/60 rounded-lg p-1.5 border border-white/5">
                    <div class="text-[9px] text-slate-500 uppercase tracking-wide">${tx(st[0])}</div>
                    <div class="flex justify-between text-xs font-bold mt-0.5">
                        <span class="text-emerald-400">${st[1]}</span>
                        <span class="text-rose-400">${st[2]}</span>
                    </div>
                </div>`).join('');

            document.getElementById('m-sub-banner').innerHTML = gameState.selectedSubstitutionOut
                ? `<div class="p-3 bg-indigo-950/90 border border-indigo-500/40 text-center rounded-xl text-xs font-bold animate-pulse text-indigo-300">🔄 ${gameState.selectedSubstitutionOut.ad} ${tx('çıkıyor. Yerine girmesi için aşağıdaki yedeklerden birine tıklayın!')}</div>`
                : '';

            document.getElementById('m-bench').innerHTML = gameState.myTeam.oyuncular
                .filter(p => !gameState.myTeam.ilk_11.includes(p))
                .map(p => `
                    <div onclick="triggerMatchSubstitution('${p.ad}')" class="p-2.5 bg-slate-950/80 rounded-xl border border-white/5 hover:border-emerald-500/40 transition-all cursor-pointer">
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-xs text-white">${p.ad.split(' ')[0]}</p>
                            <span class="text-[9px] bg-slate-800 text-slate-300 font-black px-1.5 py-0.5 rounded">${tx(p.mevkii)}</span>
                        </div>
                        <div class="flex justify-between items-center mt-1.5 text-[10px]">
                            <span class="text-slate-500 font-semibold">${tx('Yetenek')}: ${p.yetenek}</span>
                            <span class="${p.enerji < 50 ? 'text-rose-400' : 'text-emerald-400'} font-black">⚡ %${Math.round(p.enerji)}</span>
                        </div>
                    </div>`).join('');

            document.getElementById('m-eventlog').innerHTML = gameState.matchEvents
                .map(e => `<p class="text-xs mb-1.5 border-b border-white/5 pb-1 ${e.color}"><span class="text-slate-500 font-bold mr-3">${e.min}'</span> ${e.text}</p>`).join('');

            document.getElementById('m-endbtn').innerHTML = !gameState.isMatchLive
                ? `<button onclick="changeView('main_menu')" class="w-full py-4 bg-white text-slate-950 hover:bg-slate-100 rounded-xl font-black uppercase tracking-widest shadow-xl transition-all">${tx('ANA MENÜYE DÖN')}</button>`
                : '';

            refreshPlayerNodes();
        }

        function triggerMatchSubstitution(playerAd) {
            if(!gameState.selectedSubstitutionOut) {
                const p = gameState.myTeam.ilk_11.find(x => x.ad === playerAd);
                if(p) {
                    gameState.selectedSubstitutionOut = p;
                    triggerToast(tx("DEĞİŞİKLİK"), `${p.ad} ${tx('seçildi. Şimdi yedek kulübesinden bir oyuncu seçin.')}`);
                    if (gameState.view === 'match' && gameState.sim) updateMatchHud(); else render();
                }
            } else {
                const pOut = gameState.selectedSubstitutionOut;
                const pIn = gameState.myTeam.oyuncular.find(x => x.ad === playerAd);
                if(pIn && !gameState.myTeam.ilk_11.includes(pIn)) {
                    const idx = gameState.myTeam.ilk_11.indexOf(pOut);
                    if(idx !== -1) {
                        gameState.myTeam.ilk_11[idx] = pIn;
                        gameState.matchEvents.unshift({ min: gameState.matchMinute, text: `🔄 OYUNCU DEĞİŞİKLİĞİ: Giren: ${pIn.ad} | Çıkan: ${pOut.ad}`, color: 'text-emerald-400 font-bold' });
                        triggerToast(tx("KULÜBE REAKSİYONU"), `${pOut.ad} ${tx('çıktı,')} ${pIn.ad} ${tx('oyuna girdi!')}`);
                    }
                }
                gameState.selectedSubstitutionOut = null;
                refreshPlayerNodes();
                if (gameState.view === 'match' && gameState.sim) updateMatchHud(); else render();
            }
        }

        /* =====================================================================
           3D STADYUM MOTORU (Three.js r128)
           - Gerçek 3B oyuncular sahada sim konumlarına göre gerçekçi hareket eder.
           - Jumbotron dev ekran maçın 2D üstten görünümünü canlı yansıtır.
           - Kamera modları: Ekran (koltuktan izle), Kenar (yandan), Geniş, Serbest.
           - Danışman Baldric saha kenarında 3B figür olarak durur.
        ===================================================================== */
        const Stadium3D = (function () {
            const PITCH_L = 64, PITCH_W = 42, HALF_L = PITCH_L / 2, HALF_W = PITCH_W / 2;
            let renderer, scene, camera, raf = null;
            let players = { home: [], away: [] }, ball = null, ballShadow = null, referee = null;
            let jumboTex, jumboCtx, jumboCanvas;
            let camMode = 'screen';
            let orbit = { az: 0.6, el: 0.5, r: 70, drag: false, px: 0, py: 0 };
            const tmp = new THREE.Vector3();

            // sim(0..100) -> dünya koordinatı
            function toWorld(sx, sy) {
                return { x: (sx / 100 - 0.5) * PITCH_L, z: (sy / 100 - 0.5) * PITCH_W };
            }

            function makePitchTexture() {
                const c = document.createElement('canvas'); c.width = 1024; c.height = 680;
                const x = c.getContext('2d');
                // çim şeritleri
                const stripes = 18, sw = c.width / stripes;
                for (let i = 0; i < stripes; i++) {
                    x.fillStyle = i % 2 ? '#1f8a3b' : '#197a33';
                    x.fillRect(i * sw, 0, sw, c.height);
                }
                x.strokeStyle = 'rgba(255,255,255,0.85)'; x.lineWidth = 4;
                const m = 26;
                x.strokeRect(m, m, c.width - 2 * m, c.height - 2 * m);
                x.beginPath(); x.moveTo(c.width / 2, m); x.lineTo(c.width / 2, c.height - m); x.stroke();
                x.beginPath(); x.arc(c.width / 2, c.height / 2, 80, 0, 7); x.stroke();
                x.beginPath(); x.arc(c.width / 2, c.height / 2, 4, 0, 7); x.fillStyle = '#fff'; x.fill();
                // ceza sahaları
                const paH = 250, paW = 130, gaH = 120, gaW = 55;
                [0, 1].forEach(side => {
                    const bx = side ? c.width - m - paW : m;
                    x.strokeRect(bx, c.height / 2 - paH / 2, paW, paH);
                    const gx = side ? c.width - m - gaW : m;
                    x.strokeRect(gx, c.height / 2 - gaH / 2, gaW, gaH);
                });
                const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
            }

            function makeCrowdTexture(base) {
                const c = document.createElement('canvas'); c.width = 256; c.height = 64;
                const x = c.getContext('2d');
                x.fillStyle = base; x.fillRect(0, 0, c.width, c.height);
                for (let i = 0; i < 1400; i++) {
                    const r = Math.random();
                    x.fillStyle = r < 0.33 ? '#e2e8f0' : r < 0.66 ? '#94a3b8' : ['#ef4444','#facc15','#22c55e','#3b82f6'][Math.floor(Math.random()*4)];
                    x.fillRect(Math.random() * c.width, Math.random() * c.height, 2.2, 2.2);
                }
                const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(8, 2); return t;
            }

            function buildPlayer(kitColor, shortColor) {
                const g = new THREE.Group();
                const skin = 0xe2b48c;
                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.42, 1.25, 10),
                    new THREE.MeshStandardMaterial({ color: kitColor, roughness: 0.8 }));
                torso.position.y = 1.7; torso.castShadow = true; g.add(torso);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12),
                    new THREE.MeshStandardMaterial({ color: skin, roughness: 0.7 }));
                head.position.y = 2.6; head.castShadow = true; g.add(head);
                const legMat = new THREE.MeshStandardMaterial({ color: shortColor, roughness: 0.85 });
                const legGeo = new THREE.BoxGeometry(0.32, 1.1, 0.32);
                const lL = new THREE.Mesh(legGeo, legMat); lL.position.set(-0.24, 0.55, 0); lL.castShadow = true; g.add(lL);
                const lR = new THREE.Mesh(legGeo, legMat); lR.position.set(0.24, 0.55, 0); lR.castShadow = true; g.add(lR);
                const armGeo = new THREE.BoxGeometry(0.2, 0.95, 0.2);
                const aMat = new THREE.MeshStandardMaterial({ color: kitColor, roughness: 0.8 });
                const aL = new THREE.Mesh(armGeo, aMat); aL.position.set(-0.72, 1.7, 0); g.add(aL);
                const aR = new THREE.Mesh(armGeo, aMat); aR.position.set(0.72, 1.7, 0); g.add(aR);
                g.userData = { legL: lL, legR: lR, armL: aL, armR: aR, phase: Math.random() * 6, cx: 0, cz: 0, hdg: 0 };
                g.scale.setScalar(0.92);
                return g;
            }

            function buildStand(w, color, len) {
                const grp = new THREE.Group();
                const tiers = 4;
                for (let i = 0; i < tiers; i++) {
                    const geo = new THREE.BoxGeometry(len, 2.2, 4);
                    const mat = new THREE.MeshStandardMaterial({ map: makeCrowdTexture(color), roughness: 1 });
                    const m = new THREE.Mesh(geo, mat);
                    m.position.set(0, 2 + i * 1.8, -(i * 3.4));
                    grp.add(m);
                }
                return grp;
            }

            function buildFigure(robe, hat) {
                const g = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.9, 2.0, 10),
                    new THREE.MeshStandardMaterial({ color: robe, roughness: 0.9 }));
                body.position.y = 1.0; body.castShadow = true; g.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 12),
                    new THREE.MeshStandardMaterial({ color: 0xe2b48c })); head.position.y = 2.3; g.add(head);
                const h = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.7, 12),
                    new THREE.MeshStandardMaterial({ color: hat })); h.position.y = 2.9; g.add(h);
                return g;
            }

            function init() {
                const canvas = document.getElementById('stadium3d-canvas');
                if (!canvas || !window.THREE) { console.warn('3D yok'); return false; }
                const W = canvas.clientWidth || 800, H = canvas.clientHeight || 500;
                renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(W, H, false);
                renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x070b14);
                scene.fog = new THREE.Fog(0x070b14, 90, 200);
                camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 600);

                scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x16331f, 0.75));
                const moon = new THREE.DirectionalLight(0xffffff, 0.7);
                moon.position.set(40, 80, 30); moon.castShadow = true;
                moon.shadow.mapSize.set(1024, 1024); moon.shadow.camera.left = -60; moon.shadow.camera.right = 60;
                moon.shadow.camera.top = 60; moon.shadow.camera.bottom = -60; scene.add(moon);

                // saha
                const pitch = new THREE.Mesh(new THREE.PlaneGeometry(PITCH_L, PITCH_W),
                    new THREE.MeshStandardMaterial({ map: makePitchTexture(), roughness: 0.95 }));
                pitch.rotation.x = -Math.PI / 2; pitch.receiveShadow = true; scene.add(pitch);
                const surround = new THREE.Mesh(new THREE.PlaneGeometry(PITCH_L + 26, PITCH_W + 22),
                    new THREE.MeshStandardMaterial({ color: 0x0c1322 }));
                surround.rotation.x = -Math.PI / 2; surround.position.y = -0.05; scene.add(surround);

                // kaleler
                [-1, 1].forEach(s => {
                    const gm = new THREE.MeshStandardMaterial({ color: 0xffffff });
                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 0.2), gm);
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 8), gm);
                    const gx = s * (HALF_L + 0.3);
                    post.position.set(gx, 1.7, -4); scene.add(post.clone());
                    const p2 = post.clone(); p2.position.set(gx, 1.7, 4); scene.add(p2);
                    bar.position.set(gx, 3.4, 0); scene.add(bar);
                });

                // tribünler (4 kenar)
                const sN = buildStand(0, 0x1e293b, PITCH_L + 18); sN.position.set(0, 0, -(HALF_W + 6)); scene.add(sN);
                const sS = buildStand(0, 0x1e293b, PITCH_L + 18); sS.position.set(0, 0, HALF_W + 6); sS.rotation.y = Math.PI; scene.add(sS);
                const sE = buildStand(0, 0x223044, PITCH_W + 14); sE.position.set(HALF_L + 6, 0, 0); sE.rotation.y = -Math.PI / 2; scene.add(sE);
                const sW = buildStand(0, 0x223044, PITCH_W + 14); sW.position.set(-(HALF_L + 6), 0, 0); sW.rotation.y = Math.PI / 2; scene.add(sW);

                // ışık kuleleri + spot
                [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx, sz]) => {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 26, 8),
                        new THREE.MeshStandardMaterial({ color: 0x334155 }));
                    pole.position.set(sx * (HALF_L + 10), 13, sz * (HALF_W + 9)); scene.add(pole);
                    const lamp = new THREE.Mesh(new THREE.BoxGeometry(4, 1.6, 1),
                        new THREE.MeshStandardMaterial({ color: 0xfff7d6, emissive: 0xfff2c0, emissiveIntensity: 1 }));
                    lamp.position.set(sx * (HALF_L + 9), 25, sz * (HALF_W + 8)); scene.add(lamp);
                    const spot = new THREE.SpotLight(0xfff4d6, 0.5, 200, Math.PI / 4, 0.4);
                    spot.position.copy(lamp.position); spot.target.position.set(0, 0, 0);
                    scene.add(spot); scene.add(spot.target);
                });

                // JUMBOTRON dev ekran (kuzey tribün üstü, +Z izleyiciye bakar)
                jumboCanvas = document.createElement('canvas'); jumboCanvas.width = 512; jumboCanvas.height = 320;
                jumboCtx = jumboCanvas.getContext('2d');
                jumboTex = new THREE.CanvasTexture(jumboCanvas);
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(34, 21),
                    new THREE.MeshBasicMaterial({ map: jumboTex }));
                screen.position.set(0, 15, -(HALF_W + 9.4)); scene.add(screen);
                const frame = new THREE.Mesh(new THREE.BoxGeometry(36.5, 23.5, 1),
                    new THREE.MeshStandardMaterial({ color: 0x0a0f1a }));
                frame.position.set(0, 15, -(HALF_W + 10)); scene.add(frame);
                // direkler
                [-12, 12].forEach(dx => {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 14, 8),
                        new THREE.MeshStandardMaterial({ color: 0x1e293b }));
                    leg.position.set(dx, 6, -(HALF_W + 10)); scene.add(leg);
                });

                // TEKNİK ALAN (güney kenar) + kulübe + Baldric + menajer
                const dug = new THREE.Mesh(new THREE.BoxGeometry(14, 2.4, 3),
                    new THREE.MeshStandardMaterial({ color: 0x0f172a }));
                dug.position.set(0, 1.2, HALF_W + 3.5); scene.add(dug);
                const baldric = buildFigure(0x4338ca, 0xf59e0b);
                baldric.position.set(3.4, 0, HALF_W + 2.6); baldric.rotation.y = Math.PI;
                baldric.scale.setScalar(1.05); scene.add(baldric);
                const manager = buildFigure(0x0f766e, 0x111827);
                manager.position.set(-1.2, 0, HALF_W + 2.6); manager.rotation.y = Math.PI; scene.add(manager);

                // OYUNCULAR
                const [ev, dep] = gameState.currentMatch;
                for (let i = 0; i < 11; i++) {
                    const hp = buildPlayer(0x10b981, 0x065f46); scene.add(hp); players.home.push(hp);
                    const ap = buildPlayer(0xef4444, 0x7f1d1d); scene.add(ap); players.away.push(ap);
                }
                // HAKEM — siyah formalı, topu uzaktan takip eder
                referee = buildPlayer(0x111827, 0x111827);
                referee.scale.setScalar(0.88);
                referee.position.set(-4, 0, 3);
                scene.add(referee);

                // KORNER BAYRAKLARI
                [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sz]) => {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 6),
                        new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
                    pole.position.set(sx * HALF_L, 0.8, sz * HALF_W); scene.add(pole);
                    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.45),
                        new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide }));
                    flag.position.set(sx * (HALF_L - 0.4), 1.35, sz * HALF_W); scene.add(flag);
                });

                // TOP
                ball = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }));
                ball.castShadow = true; scene.add(ball);
                ballShadow = new THREE.Mesh(new THREE.CircleGeometry(0.4, 16),
                    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 }));
                ballShadow.rotation.x = -Math.PI / 2; ballShadow.position.y = 0.02; scene.add(ballShadow);

                bindOrbit(canvas);
                setCamera('screen');
                window.addEventListener('resize', onResize);
                const ld = document.getElementById('stadium3d-loading'); if (ld) ld.style.display = 'none';
                loop();
                return true;
            }

            function bindOrbit(canvas) {
                canvas.addEventListener('pointerdown', e => { if (camMode !== 'free') return; orbit.drag = true; orbit.px = e.clientX; orbit.py = e.clientY; });
                window.addEventListener('pointerup', () => orbit.drag = false);
                window.addEventListener('pointermove', e => {
                    if (!orbit.drag) return;
                    orbit.az -= (e.clientX - orbit.px) * 0.005; orbit.el += (e.clientY - orbit.py) * 0.005;
                    orbit.el = Math.max(0.15, Math.min(1.4, orbit.el));
                    orbit.px = e.clientX; orbit.py = e.clientY;
                });
                canvas.addEventListener('wheel', e => { if (camMode !== 'free') return; e.preventDefault(); orbit.r = Math.max(30, Math.min(140, orbit.r + e.deltaY * 0.05)); }, { passive: false });
            }

            function onResize() {
                const canvas = document.getElementById('stadium3d-canvas');
                if (!canvas || !renderer) return;
                const W = canvas.clientWidth, H = canvas.clientHeight;
                renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
            }

            function setCamera(mode) {
                camMode = mode;
                ['screen', 'pitchside', 'broadcast', 'free'].forEach(m => {
                    const b = document.getElementById('cam-' + m);
                    if (b) b.classList.toggle('active', m === mode);
                });
            }

            function positionCamera() {
                if (camMode === 'screen') {
                    // Menajer koltuğundan: önde dev ekran, arada 3B oyuncular, yanda Baldric
                    camera.position.set(-2, 6.5, HALF_W + 9);
                    camera.lookAt(0, 7, -(HALF_W + 6));
                } else if (camMode === 'pitchside') {
                    camera.position.set(0, 4, HALF_W + 7);
                    camera.lookAt(0, 1.5, 0);
                } else if (camMode === 'broadcast') {
                    camera.position.set(-HALF_L * 0.6, 26, HALF_W + 20);
                    camera.lookAt(0, 0, 0);
                } else { // free
                    const x = Math.sin(orbit.az) * Math.cos(orbit.el) * orbit.r;
                    const y = Math.sin(orbit.el) * orbit.r;
                    const z = Math.cos(orbit.az) * Math.cos(orbit.el) * orbit.r;
                    camera.position.set(x, Math.max(3, y), z); camera.lookAt(0, 2, 0);
                }
            }

            function drawJumbotron() {
                const s = gameState.sim; if (!s || !jumboCtx) return;
                const x = jumboCtx, W = jumboCanvas.width, H = jumboCanvas.height;
                // saha
                x.fillStyle = '#0b3d1f'; x.fillRect(0, 0, W, H);
                const pad = 24;
                for (let i = 0; i < 12; i++) { x.fillStyle = i % 2 ? '#15803d' : '#13702f'; x.fillRect(pad + i * (W - 2 * pad) / 12, pad, (W - 2 * pad) / 12, H - 2 * pad); }
                x.strokeStyle = 'rgba(255,255,255,0.8)'; x.lineWidth = 2;
                x.strokeRect(pad, pad, W - 2 * pad, H - 2 * pad);
                x.beginPath(); x.moveTo(W / 2, pad); x.lineTo(W / 2, H - pad); x.stroke();
                x.beginPath(); x.arc(W / 2, H / 2, 28, 0, 7); x.stroke();
                const px = sx => pad + (sx / 100) * (W - 2 * pad);
                const py = sy => pad + (sy / 100) * (H - 2 * pad);
                const dot = (sx, sy, col, r) => { x.beginPath(); x.arc(px(sx), py(sy), r, 0, 7); x.fillStyle = col; x.fill(); };
                ['home', 'away'].forEach(side => {
                    for (let i = 0; i < 11; i++) { const d = s.disp[side][i]; if (d) dot(d.x, d.y, side === 'home' ? '#34d399' : '#f87171', 5); }
                });
                dot(s.ball.x, s.ball.y, '#ffffff', 3.5);
                // skor şeridi
                x.fillStyle = 'rgba(2,6,23,0.85)'; x.fillRect(0, 0, W, 20);
                x.fillStyle = '#fff'; x.font = 'bold 13px sans-serif'; x.textAlign = 'center';
                x.fillText(`${gameState.lastResult[0]} - ${gameState.lastResult[1]}   ${gameState.matchMinute}'`, W / 2, 15);
                jumboTex.needsUpdate = true;
            }

            function updateEntities(dt) {
                const s = gameState.sim; if (!s) return;
                ['home', 'away'].forEach(side => {
                    for (let i = 0; i < 11; i++) {
                        const mesh = players[side][i]; const d = s.disp[side][i]; if (!mesh || !d) continue;
                        const w = toWorld(d.x, d.y);
                        const ud = mesh.userData;
                        const dx = w.x - mesh.position.x, dz = w.z - mesh.position.z;
                        const speed = Math.hypot(dx, dz);
                        mesh.position.x += dx * 0.12; mesh.position.z += dz * 0.12;
                        if (speed > 0.02) {
                            const hdg = Math.atan2(dx, dz);
                            let diff = hdg - ud.hdg; while (diff > Math.PI) diff -= 2 * Math.PI; while (diff < -Math.PI) diff += 2 * Math.PI;
                            ud.hdg += diff * 0.2; mesh.rotation.y = ud.hdg;
                            ud.phase += dt * (6 + speed * 30);
                            const sw = Math.sin(ud.phase) * Math.min(0.7, speed * 6);
                            ud.legL.rotation.x = sw; ud.legR.rotation.x = -sw;
                            ud.armL.rotation.x = -sw * 0.7; ud.armR.rotation.x = sw * 0.7;
                            mesh.children[0].rotation.x = Math.min(0.18, speed * 1.5); // gövde öne eğim
                        } else {
                            ud.legL.rotation.x *= 0.8; ud.legR.rotation.x *= 0.8;
                            mesh.children[0].rotation.x *= 0.8;
                        }
                    }
                });
                // KALECİ DALIŞI — şut/penaltı anında köşeye uzanır
                if (s.gkAction) {
                    const gk = players[s.gkAction.side] && players[s.gkAction.side][0];
                    if (gk) {
                        if (performance.now() < s.gkAction.until) {
                            gk.rotation.z += (s.gkAction.dir * 1.15 - gk.rotation.z) * 0.25;
                            gk.position.z += s.gkAction.dir * dt * 6;
                            gk.position.y = Math.max(0.15, gk.position.y - dt * 1.2);
                        } else {
                            gk.rotation.z *= 0.75;
                            gk.position.y *= 0.75;
                            if (Math.abs(gk.rotation.z) < 0.03) { gk.rotation.z = 0; gk.position.y = 0; s.gkAction = null; }
                        }
                    } else { s.gkAction = null; }
                }

                // GOL KUTLAMASI — gol atan takım zıplayarak sevinir
                if (s.celebrate) {
                    const grp = players[s.celebrate.side] || [];
                    if (performance.now() < s.celebrate.until) {
                        grp.forEach((m, i) => {
                            if (i === 0) return;
                            m.position.y = Math.abs(Math.sin(performance.now() / 120 + i)) * 0.6;
                        });
                    } else {
                        grp.forEach(m => { m.position.y = 0; });
                        s.celebrate = null;
                    }
                }

                // HAKEM — topu 4-5 metre geriden takip eder
                if (referee) {
                    const rw = toWorld(s.ball.x, s.ball.y);
                    const tx2 = rw.x - 4, tz2 = rw.z + 3;
                    const rdx = tx2 - referee.position.x, rdz = tz2 - referee.position.z;
                    referee.position.x += rdx * 0.04;
                    referee.position.z += rdz * 0.04;
                    const rud = referee.userData;
                    const rSpeed = Math.hypot(rdx, rdz);
                    if (rSpeed > 0.5) {
                        referee.rotation.y = Math.atan2(rdx, rdz);
                        rud.phase += dt * 7;
                        const sw = Math.sin(rud.phase) * 0.45;
                        rud.legL.rotation.x = sw; rud.legR.rotation.x = -sw;
                    } else {
                        rud.legL.rotation.x *= 0.8; rud.legR.rotation.x *= 0.8;
                    }
                }

                if (ball) {
                    const w = toWorld(s.ball.x, s.ball.y);
                    ball.position.x += (w.x - ball.position.x) * 0.18;
                    ball.position.z += (w.z - ball.position.z) * 0.18;
                    const moving = Math.hypot(w.x - ball.position.x, w.z - ball.position.z);
                    // Hava topu: sim uçuş yayı (s.ball.h) zıplama efektini bastırır
                    const lift = s.ball.h || 0;
                    const bounce = lift > 0.05 ? 0 : Math.abs(Math.sin(performance.now() / 130)) * Math.min(1.4, moving * 0.8);
                    ball.position.y = 0.45 + lift + bounce;
                    ball.rotation.x += 0.2; ball.rotation.z += 0.15;
                    ballShadow.position.x = ball.position.x; ballShadow.position.z = ball.position.z;
                    // Yükseldikçe gölge küçülür — yükseklik hissi
                    const shScale = Math.max(0.35, 1 - lift * 0.18);
                    ballShadow.scale.set(shScale, shScale, shScale);
                }
            }

            let last = performance.now();
            function loop() {
                if (!renderer) return;
                raf = requestAnimationFrame(loop);
                const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
                if (gameState.sim) { updateEntities(dt); drawJumbotron(); }
                positionCamera();
                renderer.render(scene, camera);
            }

            function dispose() {
                if (raf) cancelAnimationFrame(raf); raf = null;
                window.removeEventListener('resize', onResize);
                if (renderer) { renderer.dispose(); renderer.forceContextLoss && renderer.forceContextLoss(); }
                renderer = null; scene = null; camera = null;
                players = { home: [], away: [] }; ball = null; referee = null;
            }

            return { init, dispose, setCamera, isReady: () => !!renderer };
        })();

        function stadium3dSetCamera(mode) { if (Stadium3D.isReady()) Stadium3D.setCamera(mode); }
        function toggleMatchStats() {
            const p = document.getElementById('match-stats-panel');
            if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        /* ===== DANIŞMAN BALDRIC — canlı saha kenarı analizi ===== */
        function teamAvgRating(team) {
            const arr = team.ilk_11.map(p => p._rating ?? 6.0);
            return arr.reduce((a, b) => a + b, 0) / arr.length;
        }
        function updateBaldric() {
            const el = document.getElementById('baldric-content');
            if (!el || !gameState.sim) return;
            const [ev, dep] = gameState.currentMatch;
            const sH = gameState.matchStats.home, sA = gameState.matchStats.away;
            const my = ev; // kullanıcı her zaman ev sahibi
            const rating = teamAvgRating(my);
            const tiredCount = my.ilk_11.filter(p => p.enerji < 45).length;
            const mod = tacticalModifiers(my);
            const poss = sH.possession;
            const lead = gameState.lastResult[0] - gameState.lastResult[1];

            // tempo okuması
            let tempoTxt, tempoColor;
            if (mod.fatigueRate > 1.5) { tempoTxt = 'ÇOK YÜKSEK'; tempoColor = 'text-rose-400'; }
            else if (mod.fatigueRate > 1.1) { tempoTxt = 'YÜKSEK'; tempoColor = 'text-amber-400'; }
            else if (mod.fatigueRate > 0.85) { tempoTxt = 'DENGELİ'; tempoColor = 'text-emerald-400'; }
            else { tempoTxt = 'DÜŞÜK'; tempoColor = 'text-sky-400'; }

            // öneriler
            const tips = [];
            if (tiredCount >= 2) tips.push(`⚡ ${tiredCount} ${tx('oyuncu yorgun (<%45). Değişiklik düşün.')}`);
            if (poss < 42) tips.push(tx('🎯 Top bizde durmuyor — tempoyu düşür, kısa pasa geç.'));
            if (poss > 60 && gameState.matchMinute > 20 && lead <= 0) tips.push(tx('🔓 Hakimiyet var ama gol yok — yaratıcılığı/ofansifliği artır.'));
            if (lead > 0 && gameState.matchMinute > 70) tips.push(tx('🛡️ Öndesin, son bölüm: zaman oyunu + savunma hattını düşür.'));
            if (lead < 0 && gameState.matchMinute > 60) tips.push(tx('🔥 Gerideyiz — pres ve ofansifliği yükselt, risk al.'));
            if (sH.xg > 1.2 && gameState.lastResult[0] === 0) tips.push(tx('😬 xG yüksek ama gol yok — bitiricilik kötü, forvet değiştir.'));
            if (!tips.length) tips.push(tx('👍 Plan tutuyor. Mevcut düzeni koru.'));

            const ratColor = rating >= 7.2 ? 'text-emerald-400' : rating >= 6.4 ? 'text-amber-400' : 'text-rose-400';
            el.innerHTML = `
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-slate-900/70 rounded-lg p-2 text-center"><p class="text-[8px] text-slate-500 uppercase">${tx('Takım Reytingi')}</p><p class="text-base font-black ${ratColor}">${rating.toFixed(1)}</p></div>
                    <div class="bg-slate-900/70 rounded-lg p-2 text-center"><p class="text-[8px] text-slate-500 uppercase">${tx('Tempo')}</p><p class="text-base font-black ${tempoColor}">${tx(tempoTxt)}</p></div>
                    <div class="bg-slate-900/70 rounded-lg p-2 text-center"><p class="text-[8px] text-slate-500 uppercase">xG</p><p class="text-sm font-black text-sky-400">${(sH.xg||0).toFixed(2)}<span class="text-slate-500 text-[9px]"> vs ${(sA.xg||0).toFixed(2)}</span></p></div>
                    <div class="bg-slate-900/70 rounded-lg p-2 text-center"><p class="text-[8px] text-slate-500 uppercase">${tx('Hakimiyet')}</p><p class="text-sm font-black text-emerald-400">%${poss}</p></div>
                </div>
                <div class="mt-2 space-y-1.5">
                    ${tips.map(t => `<p class="text-[10px] text-slate-200 bg-indigo-900/30 border border-indigo-500/20 rounded-lg px-2 py-1.5 leading-snug">${t}</p>`).join('')}
                </div>`;
        }

        // Maç simülasyonunu kur: oyuncuları dizilişlerine yerleştir, top ortada
        function setupMatchSim() {
            const [ev, dep] = gameState.currentMatch;
            const sim = {
                ball: { x: 50, y: 50, tx: 50, ty: 50 },
                possession: Math.random() < 0.5 ? 'home' : 'away',
                carrier: { side: 'home', idx: 6 },
                possTicks: { home: 1, away: 1 },
                disp: { home: [], away: [] },
                tgt: { home: [], away: [] },
                nodes: null,
                raf: null,
                flowTimer: null
            };
            ['home', 'away'].forEach(side => {
                const team = side === 'home' ? ev : dep;
                const defLine = (team.taktik && team.taktik.savunma_hatti) ?? 50;
                for (let i = 0; i < 11; i++) {
                    const slot = formationSlot(i, defLine);
                    const ax = side === 'home' ? slot.x : 100 - slot.x;
                    sim.disp[side].push({ x: ax, y: slot.y });
                    sim.tgt[side].push({ x: ax, y: slot.y });
                }
            });
            sim.carrier = { side: sim.possession, idx: 6 };
            gameState.sim = sim;
            // Reyting / maç sayaçlarını sıfırla
            [ev, dep].forEach(t => t.ilk_11.forEach(p => { p._rating = 6.0; p._goals = 0; }));
            computeMatchTargets();
        }

        function runMatch() {
            soundEngine.playWhistle();
            soundEngine.playMatchAmbient();

            setupMatchSim();
            buildMatchDom();
            updateMatchHud();
            // 3D stadyumu kur (DOM yerleştikten sonra ölçü doğru olsun diye bir frame bekle)
            requestAnimationFrame(() => { try { Stadium3D.init(); } catch (e) { console.warn('3D init hata:', e); } });
            // Baldric canlı analiz döngüsü
            updateBaldric();
            gameState.baldricTimer = setInterval(updateBaldric, 2500);
            // 60fps yumuşak hareket döngüsü
            gameState.sim.raf = requestAnimationFrame(animateMatchFrame);
            // Top akışı (pas / şut) — dakikadan bağımsız, sürekli oyun hissi
            gameState.sim.flowTimer = setInterval(matchFlowStep, 620);

            // Dakika saati: enerji, devre arası, maç sonu
            gameState.matchTimer = setInterval(() => {
                if (gameState.phase !== 'normal') return;
                gameState.matchMinute++;

                // Yorulma artık taktik yoğunluğuna (tempo+pres+pres tetikleyici) bağlı
                const fatigueRate = tacticalModifiers(gameState.myTeam).fatigueRate;
                gameState.myTeam.ilk_11.forEach(p => {
                    let rate = p.karakter === "Cam Adam" ? 0.38 : (p.karakter === "Hırslı" ? 0.28 : 0.20);
                    rate = rate * fatigueRate;
                    // Fizyoterapist maç içi yorulmayı azaltır
                    if (gameState.staff.fizyo) rate *= (1 - gameState.staff.fizyo.level * 0.02);
                    p.enerji = Math.max(10, p.enerji - rate);
                });

                // Devre arası
                if (gameState.matchMinute === 45) {
                    gameState.phase = 'halftime';
                    pushEvent(tx('⏸️ İLK YARI SONA ERDİ. Devre arası.'), 'text-amber-300 font-bold');
                    soundEngine.playWhistle();
                    updateMatchHud();
                    setTimeout(() => { if (gameState.isMatchLive) { gameState.phase = 'normal'; pushEvent(tx('▶️ İkinci yarı başladı!'), 'text-emerald-300 font-bold'); updateMatchHud(); } }, 1600);
                }

                if (gameState.matchMinute >= 90) {
                    clearInterval(gameState.matchTimer);
                    clearInterval(gameState.sim.flowTimer);
                    gameState.isMatchLive = false;
                    soundEngine.playWhistle();
                    soundEngine.stopMatchAmbient();
                    pushEvent(tx('🏁 MAÇ SONA ERDİ!'), 'text-white font-black');
                    finalizeMatch();
                }
                // Sadece HUD metinlerini güncelle (saha düğümleri animasyon döngüsünde)
                updateMatchHud();
            }, 340);
        }

        function finalizeMatch() {
            const [ev, dep] = gameState.currentMatch;
            const [s1, s2] = gameState.lastResult;
            ev.atilan_gol += s1; ev.yenilen_gol += s2;
            dep.atilan_gol += s2; dep.yenilen_gol += s1;
            let result; // kullanıcı gözünden (kullanıcı hep ev sahibi)
            if (s1 > s2)      { ev.puan += 3; ev.galibiyet++; dep.maglubiyet++; result = 'win'; }
            else if (s2 > s1) { dep.puan += 3; dep.galibiyet++; ev.maglubiyet++; result = 'loss'; }
            else              { ev.puan++; dep.puan++; ev.beraberlik++; dep.beraberlik++; result = 'draw'; }

            simulateOtherMatches();
            gameState.trainingRights = 1;
            gameState.negotiationBlocked = new Set();

            // === FM v3.0 HAFTALIK KULÜP DÖNGÜSÜ ===
            updateFanSupport(result, s1, s2);
            processWeeklyFinance(result);
            updateMoraleWeekly(result);
            updateBoardWeekly(result);

            if (gameState.currentWeek < 14) {
                gameState.currentWeek++;
            } else {
                endSeason();
            }
            updateWeekIndicator();
            checkFired();
        }

        /* =====================================================================
           FM v3.0 — HAFTALIK KULÜP EKONOMİSİ & YÖNETİM DÖNGÜSÜ
        ===================================================================== */
        function leagueTableSorted() {
            return [...gameState.league.takimlar].sort((a, b) =>
                b.puan - a.puan || (b.atilan_gol - b.yenilen_gol) - (a.atilan_gol - a.yenilen_gol));
        }

        function updateFanSupport(result, s1, s2) {
            let d = result === 'win' ? 4 : result === 'draw' ? 0 : -4;
            d += Math.min(3, s1);                              // atılan gol coşturur
            if (s2 >= 3) d -= 2;                               // farklı yenilgi kırar
            if (gameState.finance.ticketPrice > 40) d -= 1;    // fahiş bilet soğutur
            gameState.fanSupport = Math.max(10, Math.min(100, gameState.fanSupport + d));
        }

        function processWeeklyFinance(result) {
            const f = gameState.finance;
            const team = gameState.myTeam;
            const r2 = v => Math.round(v * 100) / 100;
            // — GELİRLER —
            const priceFactor = Math.max(0.30, Math.min(1.15, 1.55 - f.ticketPrice / 38));
            f.lastAttendance = Math.min(gameState.stadium.capacity,
                Math.round(gameState.stadium.capacity * (gameState.fanSupport / 100) * priceFactor));
            const bilet = r2(f.lastAttendance * f.ticketPrice / 1e6);
            const pos = leagueTableSorted().indexOf(team) + 1;
            const tv = r2(1.5 + (8 - pos) * 0.15);
            const sponsor = f.sponsor ? r2(f.sponsor.weekly + (result === 'win' ? (f.sponsor.winBonus || 0) : 0)) : 0;
            const odul = result === 'win' ? 2.5 : result === 'draw' ? 1.0 : 0.3;
            // — GİDERLER —
            const oyuncuMaas = r2(team.oyuncular.reduce((a, p) => a + (p.maas || 0), 0));
            const personel = r2(Object.values(gameState.staff).reduce((a, st) => a + (st ? st.wage : 0), 0));
            const bakim = r2(gameState.stadium.level * 0.15);
            const net = r2(bilet + tv + sponsor + odul - oyuncuMaas - personel - bakim);
            team.butce = Math.round((team.butce + net) * 10) / 10;
            f.history.unshift({ week: gameState.currentWeek, season: gameState.season,
                bilet, tv, sponsor, odul, oyuncuMaas, personel, bakim, net });
            if (f.history.length > 15) f.history.pop();
            triggerToast('💰 ' + tx('FİNANS OFİSİ'),
                `${tx('Net')}: ${net >= 0 ? '+' : ''}${net.toFixed(2)}M € • 🎟️ ${f.lastAttendance.toLocaleString('tr-TR')}`,
                net >= 0 ? 'success' : 'error');
        }

        function updateMoraleWeekly(result) {
            const team = gameState.myTeam;
            const resD = result === 'win' ? 4 : result === 'draw' ? 0 : -4;
            team.oyuncular.forEach(p => {
                let d = resD;
                d += team.ilk_11.includes(p) ? 2 : -3;                       // oynamak mutlu eder
                if ((p.maas || 0) < p.wageDemand() * 0.8) d -= 1;            // düşük maaş huzursuzluğu
                if ((p.sozlesme ?? 2) <= 1) d -= 1;                          // belirsiz gelecek
                if (p.karakter === 'Hırslı' && !team.ilk_11.includes(p)) d -= 2;
                p.moral = Math.max(5, Math.min(100, (p.moral ?? 70) + d));
            });
        }

        function boardMsg(text, tone = 'info') {
            gameState.board.messages.unshift({ week: gameState.currentWeek, season: gameState.season, text, tone });
            if (gameState.board.messages.length > 14) gameState.board.messages.pop();
        }

        function updateBoardWeekly(result) {
            const b = gameState.board;
            let d = result === 'win' ? 5 : result === 'draw' ? 0 : -6;
            const pos = leagueTableSorted().indexOf(gameState.myTeam) + 1;
            const target = b.objective === 'championship' ? 1 : b.objective === 'top3' ? 3 : 5;
            if (gameState.currentWeek > 7 && pos > target) d -= 2;   // sezon sonuna doğru hedef baskısı
            if (gameState.myTeam.butce < 0) d -= 3;                  // kırmızı kasa affedilmez
            b.confidence = Math.max(0, Math.min(100, b.confidence + d));
            if (result === 'win') boardMsg(tx('Yönetim galibiyetten memnun.'), 'good');
            else if (result === 'loss') boardMsg(tx('Yönetim mağlubiyetten rahatsız.'), 'bad');
            if (gameState.currentWeek > 7 && pos > target)
                boardMsg(`${tx('Hedefin gerisindeyiz — mevcut sıra:')} ${pos}.`, 'bad');
        }

        function checkFired() {
            const b = gameState.board;
            if (gameState.fired) return;
            if (b.confidence <= 0 || gameState.myTeam.butce < -20) {
                gameState.fired = true;
                showFiredOverlay();
            } else if (b.confidence <= 15) {
                triggerToast(tx('YÖNETİM KURULU'), tx('Son uyarı: sonuçlar düzelmezse görevden alınacaksınız!'), 'error');
            }
        }

        function showFiredOverlay() {
            const o = document.createElement('div');
            o.id = 'fired-overlay';
            o.className = 'fixed inset-0 z-[20000] bg-slate-950/95 backdrop-blur flex items-center justify-center p-6';
            o.innerHTML = `
                <div class="max-w-md w-full bg-gradient-to-br from-rose-950 to-slate-950 border border-rose-500/40 rounded-3xl p-8 text-center shadow-2xl animate-fade-in">
                    <div class="text-6xl mb-4">🪑🔥</div>
                    <h2 class="text-3xl font-black italic text-rose-400 uppercase mb-3">${tx('KOVULDUNUZ!')}</h2>
                    <p class="text-sm text-slate-300 mb-6">${tx('Yönetim kurulu güveni tükendi ve görevinize son verdi.')}</p>
                    <button onclick="window.location.reload()" class="w-full py-4 bg-white text-slate-950 hover:bg-slate-100 rounded-xl font-black uppercase tracking-widest shadow-xl">${tx('YENİDEN BAŞLA')}</button>
                </div>`;
            document.body.appendChild(o);
        }

        function endSeason() {
            const sorted = leagueTableSorted();
            const pos = sorted.indexOf(gameState.myTeam) + 1;
            const b = gameState.board;
            if (sorted[0].isUser) {
                gameState.myTeam.butce += 30.0;
                triggerToast(tx("KUPAYI KALDIRDIK!"), tx("ŞAMPİYON OLDUNUZ! Kulübünüze 30M € Şampiyonluk ödülü eklendi!"), "success");
            } else {
                triggerToast(tx("SEZON SONU"), `${tx('Şampiyonluğu')} ${sorted[0].ad} ${tx('takımına kaptırdınız.')}`, "error");
            }
            // Hedef değerlendirmesi
            const target = b.objective === 'championship' ? 1 : b.objective === 'top3' ? 3 : 5;
            if (pos <= target) {
                b.confidence = Math.min(100, b.confidence + 18);
                gameState.myTeam.butce += 8;
                boardMsg(tx('Hedef tutturuldu! Yönetim transfer bütçesine +8M € ekledi.'), 'good');
            } else {
                b.confidence = Math.max(0, b.confidence - 18);
                boardMsg(tx('Sezon hedefi tutmadı. Yönetim sabırsızlanıyor.'), 'bad');
            }
            // Sözleşme yılları düşer; bitenler bedavaya gider
            gameState.myTeam.oyuncular.forEach(p => { p.sozlesme = (p.sozlesme ?? 1) - 1; });
            const leavers = gameState.myTeam.oyuncular.filter(p => (p.sozlesme ?? 0) <= 0);
            gameState.myTeam.oyuncular = gameState.myTeam.oyuncular.filter(p => (p.sozlesme ?? 0) > 0);
            leavers.forEach(p => boardMsg(`${p.ad} ${tx('serbest kaldı (sözleşme bitti).')}`, 'bad'));
            // Kadro 16'nın altına inmesin — altyapıdan acil takviye
            while (gameState.myTeam.oyuncular.length < 16) {
                const yp = new Player(getRandomName(), ["Kaleci","Defans","Orta Saha","Forvet"][Math.floor(Math.random()*4)],
                    50 + Math.random()*10, 0, 19 + Math.floor(Math.random()*4), 78);
                yp.sozlesme = 2;
                gameState.myTeam.oyuncular.push(yp);
            }
            // Yaşlanma & toparlanma
            gameState.myTeam.oyuncular.forEach(p => {
                p.yas++;
                if (p.yas >= 31) p.yetenek = Math.max(45, p.yetenek - 1);
                p.enerji = 100; p.form = 80;
            });
            gameState.myTeam.otoSecIlk11();
            // Ligi sıfırla, yeni sezonu kur
            gameState.league.takimlar.forEach(t => {
                t.puan = 0; t.galibiyet = 0; t.beraberlik = 0; t.maglubiyet = 0;
                t.atilan_gol = 0; t.yenilen_gol = 0;
            });
            gameState.season++;
            gameState.currentWeek = 1;
            b.extraBudgetUsed = false;
            gameState.finance.sponsor = null;
            setSeasonObjective();
            generateSponsorOffers();
            triggerToast(tx('SEZON BİTTİ'), tx('Yeni sezon başladı! Sözleşmeler ve hedefler güncellendi.'));
        }

        function setSeasonObjective() {
            const rank = [...gameState.league.takimlar].sort((a, b) => b.getGuc() - a.getGuc())
                .indexOf(gameState.myTeam) + 1;
            const b = gameState.board;
            if (rank <= 2)      { b.objective = 'championship'; b.objectiveText = 'Şampiyon Ol'; }
            else if (rank <= 4) { b.objective = 'top3'; b.objectiveText = 'İlk 3\'te Bitir'; }
            else                { b.objective = 'top5'; b.objectiveText = 'İlk 5\'te Bitir'; }
            boardMsg(`${tx('Sezon Hedefi')}: ${tx(b.objectiveText)}`, 'info');
        }

        function generateSponsorOffers() {
            const guc = gameState.myTeam.getGuc();
            const base = 1.2 + Math.max(0, guc - 70) * 0.05;
            const r2 = v => Math.round(v * 100) / 100;
            gameState.finance.sponsorOffers = [
                { name: 'ByteBank',       weekly: r2(base * 1.25), winBonus: 0,               desc: 'Garantili sabit gelir' },
                { name: 'Kartal Enerji',  weekly: r2(base * 0.75), winBonus: r2(base * 0.90), desc: 'Galibiyet başına yüksek prim' },
                { name: 'AnadoluJet Air', weekly: r2(base * 1.00), winBonus: r2(base * 0.35), desc: 'Dengeli paket' }
            ];
        }

        function pickSponsor(i) {
            const off = gameState.finance.sponsorOffers[i];
            if (!off || gameState.finance.sponsor) return;
            gameState.finance.sponsor = off;
            triggerToast(tx('Sponsor Anlaşması'), `${off.name}: ${off.weekly}M €/${tx('hafta')}`);
            render();
        }

        function setTicketPrice(v) {
            gameState.finance.ticketPrice = Math.max(10, Math.min(60, parseInt(v) || 25));
            render();
        }

        function requestExtraBudget() {
            const b = gameState.board;
            if (b.extraBudgetUsed) { triggerToast(tx('YÖNETİM KURULU'), tx('Bu sezon zaten ek bütçe aldınız.'), 'error'); return; }
            b.extraBudgetUsed = true;
            if (b.confidence >= 65) {
                gameState.myTeam.butce = Math.round((gameState.myTeam.butce + 10) * 10) / 10;
                b.confidence -= 5;
                boardMsg(tx('Yönetim ek bütçe talebinizi onayladı: +10M €!'), 'good');
                triggerToast(tx('YÖNETİM KURULU'), tx('Yönetim ek bütçe talebinizi onayladı: +10M €!'));
            } else {
                b.confidence = Math.max(0, b.confidence - 5);
                boardMsg(tx('Yönetim talebi reddetti. Güven sarsıldı (-5).'), 'bad');
                triggerToast(tx('YÖNETİM KURULU'), tx('Yönetim talebi reddetti. Güven sarsıldı (-5).'), 'error');
            }
            render();
        }

        function hireStaff(role, id) {
            const cand = (gameState.staffCandidates[role] || []).find(c => c.id === id);
            if (!cand) return;
            gameState.staff[role] = cand;
            triggerToast(tx('İşe Al'), `${cand.name} ${tx('göreve başladı!')}`);
            render();
        }

        function fireStaff(role) {
            const st = gameState.staff[role];
            if (!st) return;
            gameState.staff[role] = null;
            triggerToast(tx('KOVULDU'), `${st.name} ${tx('kadrodan ayrıldı.')}`, 'error');
            render();
        }

        function upgradeStadium() {
            const st = gameState.stadium;
            if (st.level >= 5) { triggerToast(tx('STADYUM MAKSİMUM'), tx('Stadyum zaten en büyük boyutunda!'), 'error'); return; }
            const cost = st.level * 18;
            if (gameState.myTeam.butce < cost) { triggerToast(tx('BÜTÇE YETERSİZ'), tx('Tesisleri yükseltmek için yeterli bütçe yok!'), 'error'); return; }
            gameState.myTeam.butce -= cost;
            st.level++;
            st.capacity += 8000;
            triggerToast(tx('TESİSLER YÜKSELTİLDİ'), tx('Stadyum kapasiteniz arttı!'));
            render();
        }

        /* ===== SÖZLEŞME PAZARLIĞI (FM tarzı) ===== */
        function openNegotiation(ad) {
            if (gameState.negotiationBlocked.has(ad)) {
                triggerToast(tx('SÖZLEŞME PAZARLIĞI'), `${ad} ${tx('masadan kalktı! Bu hafta tekrar görüşmez.')}`, 'error');
                return;
            }
            const p = gameState.myTeam.oyuncular.find(x => x.ad === ad);
            if (!p) return;
            const demand = p.wageDemand();
            gameState.negotiation = { ad, demand, offer: Math.round(demand * 0.9 * 1000) / 1000, years: 2, rounds: 0 };
            render();
        }

        function setNegotiationYears(y) {
            if (gameState.negotiation) { gameState.negotiation.years = y; render(); }
        }

        function submitOffer() {
            const n = gameState.negotiation; if (!n) return;
            const p = gameState.myTeam.oyuncular.find(x => x.ad === n.ad);
            if (!p) { gameState.negotiation = null; render(); return; }
            const ratio = n.offer / n.demand;
            const yearsBonus = n.years >= 3 ? 0.03 : 0;   // uzun sözleşme güven verir
            if (ratio + yearsBonus >= 0.97) {
                p.maas = n.offer;
                p.sozlesme = n.years;
                p.moral = Math.min(100, (p.moral ?? 70) + 10);
                triggerToast(tx('İMZALANDI'), `${p.ad} ${tx('yeni sözleşmeye imza attı!')}`);
                gameState.negotiation = null;
            } else if (ratio >= 0.80 && n.rounds < 2) {
                n.rounds++;
                n.demand = Math.round(n.demand * 0.97 * 1000) / 1000;   // menajer azıcık iner
                triggerToast(tx('TEKLİF REDDEDİLDİ'), `${p.ad} ${tx('teklifi az buldu. Talebe yaklaşın.')}`, 'error');
            } else {
                p.moral = Math.max(5, (p.moral ?? 70) - 6);
                gameState.negotiationBlocked.add(p.ad);
                triggerToast(tx('TEKLİF REDDEDİLDİ'), `${p.ad} ${tx('masadan kalktı! Bu hafta tekrar görüşmez.')}`, 'error');
                gameState.negotiation = null;
            }
            render();
        }

        function cancelNegotiation() { gameState.negotiation = null; render(); }

        function sellPlayer(ad) {
            const team = gameState.myTeam;
            if (team.oyuncular.length <= 16) { triggerToast(tx('HATA'), tx('Kadro 16 oyuncunun altına düşemez!'), 'error'); return; }
            const p = team.oyuncular.find(x => x.ad === ad);
            if (!p) return;
            let fee = p.fiyat || Math.round(p.yetenek * 0.2 * 10) / 10;
            if ((p.moral ?? 70) < 30) fee = Math.round(fee * 0.7 * 10) / 10;   // mutsuz oyuncu değer kaybettirir
            team.butce = Math.round((team.butce + fee) * 10) / 10;
            team.oyuncular = team.oyuncular.filter(x => x !== p);
            if (team.ilk_11.includes(p)) team.otoSecIlk11();
            triggerToast(tx('OYUNCU SATILDI'), `${p.ad} ${fee.toFixed(1)}M € ${tx('bonservisiyle kulüpten ayrıldı.')}`);
            render();
        }

        function simulateOtherMatches() {
            const otherTeams = gameState.league.takimlar.filter(t => t !== gameState.currentMatch[0] && t !== gameState.currentMatch[1]);
            for(let i = 0; i < otherTeams.length; i += 2) {
                if(i+1 >= otherTeams.length) break;
                const t1 = otherTeams[i];
                const t2 = otherTeams[i+1];

                const g1 = t1.getGuc() + Math.random()*12;
                const g2 = t2.getGuc() + Math.random()*12;

                let s1 = 0, s2 = 0;
                if(g1 > g2 + 6) { s1 = Math.floor(Math.random()*3)+1; s2 = Math.floor(Math.random()*2); }
                else if(g2 > g1 + 6) { s2 = Math.floor(Math.random()*3)+1; s1 = Math.floor(Math.random()*2); }
                else { s1 = Math.floor(Math.random()*2); s2 = s1; }

                t1.atilan_gol += s1; t1.yenilen_gol += s2;
                t2.atilan_gol += s2; t2.yenilen_gol += s1;

                if (s1 > s2) { t1.puan += 3; t1.galibiyet++; t2.maglubiyet++; }
                else if (s2 > s1) { t2.puan += 3; t2.galibiyet++; t1.maglubiyet++; }
                else { t1.puan++; t2.puan++; t1.beraberlik++; t2.beraberlik++; }
            }
        }

        function updateWeekIndicator() {
            document.getElementById('week-indicator-ui').textContent = `${tx('Sezon').toUpperCase()} ${gameState.season} • LİG • ${tx('Hafta').toUpperCase()} ${gameState.currentWeek}`;
        }

        function changeView(v) {
            // Maçtan ayrılırken canlı simülasyon kaynaklarını temizle
            if (gameState.view === 'match' && v !== 'match' && gameState.sim) {
                if (gameState.sim.raf) cancelAnimationFrame(gameState.sim.raf);
                if (gameState.sim.flowTimer) clearInterval(gameState.sim.flowTimer);
                if (gameState.matchTimer) clearInterval(gameState.matchTimer);
                if (gameState.baldricTimer) clearInterval(gameState.baldricTimer);
                try { Stadium3D.dispose(); } catch (e) {}
                gameState.isMatchLive = false;
                gameState.sim = null;
            }
            gameState.view = v;
            render();
        }

        function executeTrainingRegime(regimeType) {
            if(gameState.trainingRights <= 0) {
                triggerToast(tx("HATA"), tx("Bu hafta zaten antrenman yaptınız! Yeni antrenman hakkı kazanmak için sıradaki maçınızı oynamalısınız."), "error");
                return;
            }

            let logs = [];
            let avgEnergyCost = 0;
            let targetMevkii = null;

            if(!soundEngine.muted) {
                soundEngine.init();
                if (soundEngine.ctx) {
                    let osc = soundEngine.ctx.createOscillator();
                    let g = soundEngine.ctx.createGain();
                    osc.frequency.setValueAtTime(600, soundEngine.ctx.currentTime);
                    osc.frequency.setValueAtTime(900, soundEngine.ctx.currentTime + 0.1);
                    g.gain.setValueAtTime(0.05, soundEngine.ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, soundEngine.ctx.currentTime + 0.25);
                    osc.connect(g);
                    g.connect(soundEngine.ctx.destination);
                    osc.start();
                    osc.stop(soundEngine.ctx.currentTime + 0.3);
                }
            }

            switch(regimeType) {
                case 'hucum':
                    targetMevkii = "Forvet";
                    avgEnergyCost = 22;
                    logs.push("Hücum çalışması forvetlere teknik ve şut performansı sağladı.");
                    break;
                case 'savunma':
                    targetMevkii = "Defans";
                    avgEnergyCost = 20;
                    logs.push("Defans oyuncuları sıkı pres antrenmanına tabi tutuldu.");
                    break;
                case 'taktik':
                    targetMevkii = "Orta Saha";
                    avgEnergyCost = 15;
                    logs.push("Orta saha pas kombinasyonları ve vizyon odaklı taktik çalıştı.");
                    break;
                case 'kondisyon':
                    avgEnergyCost = 18;
                    logs.push("Tüm takım kondisyon depoladı. Form grafikleri gözle görülür yükseldi.");
                    break;
                case 'dinlenme':
                    logs.push("Takım hafif rejenerasyon ve masaj seansı alarak enerji topladı.");
                    break;
            }

            gameState.myTeam.oyuncular.forEach(p => {
                if (regimeType === 'dinlenme') {
                    let recover = p.karakter === "Çalışkan" ? 30 : 25;
                    // Fizyoterapist dinlenme verimini artırır
                    if (gameState.staff.fizyo) recover += gameState.staff.fizyo.level * 2;
                    p.enerji = Math.min(100, p.enerji + recover);
                    p.form = Math.max(50, p.form - 2);
                    logs.push(`${p.ad}: Enerji +${recover}, Form -2`);
                } else {
                    let decay = p.karakter === "Cam Adam" ? avgEnergyCost * 1.3 : avgEnergyCost;
                    p.enerji = Math.max(15, p.enerji - decay);
                    p.form = Math.min(100, p.form + Math.floor(Math.random() * 12 + 4));

                    if (p.yetenek < p.potansiyel) {
                        let baseGrowthChance = 0.35;
                        if (p.karakter === "Çalışkan") baseGrowthChance += 0.2;
                        if (p.karakter === "Disiplinsiz") baseGrowthChance -= 0.15;
                        // Yardımcı antrenör gelişim şansını yükseltir
                        if (gameState.staff.antrenor) baseGrowthChance += gameState.staff.antrenor.level * 0.03;

                        if (p.mevkii === targetMevkii || regimeType === 'kondisyon') {
                            baseGrowthChance += 0.25;
                        }

                        if (Math.random() < baseGrowthChance) {
                            p.yetenek += 1;
                            logs.push(`📈 Gelişim: ${p.ad} yeteneğini ${p.yetenek} seviyesine çıkardı!`);
                        }
                    }
                }
            });

            gameState.lastTrainingSummary = {
                title: regimeType.toUpperCase() + " ANTRENMANI RAPORU",
                items: logs.slice(0, 10)
            };

            gameState.trainingRights--;
            triggerToast(tx("ANTRENMAN TAMAMLANDI"), tx("Haftalık antrenman hakkınız kullanıldı. Oyuncu değerleri güncellendi."));
            render();
        }

        function hireAcademyScout(scoutId) {
            const scout = gameState.academyScouts.find(s => s.id === scoutId);
            if(scout && !scout.hired) {
                if(gameState.myTeam.butce >= scout.cost) {
                    gameState.myTeam.butce -= scout.cost;
                    scout.hired = true;
                    triggerToast(tx("YENİ GÖZLEMCİ"), `${scout.name} ${tx('scout ekibine katıldı! Altyapı havuzunuz genişletildi.')}`);
                    generateAcademyPlayers();
                    render();
                } else {
                    triggerToast(tx("BÜTÇE YETERSİZ"), tx("Bu gözlemciyi kiralamak için paranız yetersiz!"), "error");
                }
            }
        }

        function upgradeAcademyFacilities() {
            const cost = gameState.academyLevel * 8.5;
            if (gameState.academyLevel >= 5) {
                triggerToast(tx("MAKSİMUM SEVİYE"), tx("Altyapı tesisleriniz zaten son model dünya standartlarında!"), "error");
                return;
            }
            if(gameState.myTeam.butce >= cost) {
                gameState.myTeam.butce -= cost;
                gameState.academyLevel++;
                generateAcademyPlayers();
                triggerToast(tx("TESİSLER YÜKSELTİLDİ"), `${tx('Altyapı seviyeniz yükseldi! Yeni seviye: ')}${gameState.academyLevel}`);
                render();
            } else {
                triggerToast(tx("BÜTÇE YETERSİZ"), tx("Tesisleri yükseltmek için yeterli bütçe yok!"), "error");
            }
        }

        function trainIndividualYouth(playerAd) {
            const idx = gameState.academyPool.findIndex(p => p.ad === playerAd);
            if(idx !== -1) {
                const p = gameState.academyPool[idx];
                const trainingCost = 0.8;
                if(gameState.myTeam.butce >= trainingCost) {
                    gameState.myTeam.butce -= trainingCost;
                    let boost = p.karakter === "Dahi" ? 4 : (p.karakter === "Hırslı" ? 3 : 2);
                    p.yetenek = Math.min(p.potansiyel, p.yetenek + boost);
                    p.form = Math.min(100, p.form + 15);
                    triggerToast(tx("ÖZEL EĞİTİM"), `${p.ad}: ${tx('Yetenek')} +${boost} ${tx('arttı!')}`);
                    render();
                } else {
                    triggerToast(tx("BÜTÇE YETERSİZ"), tx("Bu antrenman bütçesini karşılayacak nakit yok!"), "error");
                }
            }
        }

        function promoteYouthToPro(playerAd) {
            const idx = gameState.academyPool.findIndex(p => p.ad === playerAd);
            if(idx !== -1) {
                const p = gameState.academyPool[idx];
                const signFee = 1.5;
                if(gameState.myTeam.butce >= signFee) {
                    gameState.myTeam.butce -= signFee;
                    gameState.myTeam.oyuncular.push(p);
                    gameState.academyPool.splice(idx, 1);
                    triggerToast(tx("A TAKIMA ÇIKTI"), `${p.ad} ${tx('profesyonel sözleşmeye imza attı! (Maliyet:')} ${signFee}M €)`);
                    render();
                } else {
                    triggerToast(tx("İMZA ÜCRETİ"), `${signFee}M € ${tx('imza ücreti bütçenizde yok!')}`, "error");
                }
            }
        }

        function generateAcademyPlayers() {
            gameState.academyPool = [];
            const posOptions = ["Kaleci", "Defans", "Orta Saha", "Forvet"];
            const hiredCount = gameState.academyScouts.filter(s => s.hired).length;
            const size = 3 + hiredCount;

            for(let i=0; i<size; i++) {
                const pos = posOptions[Math.floor(Math.random()*4)];
                const age = 15 + Math.floor(Math.random()*4);
                const maxScoutLevel = Math.max(...gameState.academyScouts.filter(s => s.hired).map(s => s.level));
                const baseSkill = 42 + (gameState.academyLevel * 2) + (maxScoutLevel * 2.5) + Math.random()*8;
                const potential = Math.min(99, baseSkill + 12 + Math.random()*12);
                const char = ACADEMY_CHARACTERS[Math.floor(Math.random()*ACADEMY_CHARACTERS.length)];
                gameState.academyPool.push(new Player(getRandomName() + " (Altyapı)", pos, baseSkill, 0, age, potential, 100, 75, "Yedek Gelişim", char));
            }

            const p = gameState.transferPool.find(x => x.ad === ad);
            if(gameState.myTeam.butce >= p.fiyat) {
                gameState.myTeam.butce -= p.fiyat;
                // Yeni transfer: menajer talebi kadar maaş, 3 sezonluk sözleşme
                p.maas = p.wageDemand();
                p.sozlesme = 3;
                p.moral = 78;
                gameState.myTeam.oyuncular.push(p);
                gameState.transferPool.splice(gameState.transferPool.indexOf(p), 1);
                triggerToast(tx("YENİ YILDIZ KATILDI"), `${p.ad} ${tx('başarıyla transfer edildi!')}`);
                render();
            } else {
                triggerToast(tx("BÜTÇE YETERSİZ"), tx("Transfer gerçekleştirmek için bütçeniz yetersiz!"), "error");

            const p = gameState.myTeam.oyuncular.find(x => x.ad === ad);
            const outIdx = gameState.myTeam.ilk_11.findIndex(x => x.mevkii === p.mevkii);
            if(outIdx !== -1) {
                const outPlayer = gameState.myTeam.ilk_11[outIdx];
                gameState.myTeam.ilk_11[outIdx] = p;
                triggerToast(tx("KADRO PLANI"), `${p.ad} ${tx('ilk 11\'e girdi, çıkan:')} ${outPlayer.ad}`);
            } else {
                gameState.myTeam.ilk_11[0] = p;

            render();

                                                <p class="text-xs font-black text-emerald-400">${cur.name}</p>
                                                <span class="text-[9px] bg-slate-800 text-amber-400 px-1.5 py-0.5 rounded font-black">⭐ ${cur.level}</span>
                                            </div>
                                            <p class="text-[10px] text-slate-400 mt-1">${Math.round(cur.wage * 1000)}K €/${tx('hafta')} • ${tx('Görevde')}</p>
                                            <button onclick="fireStaff('${role}')" class="w-full mt-2 py-1.5 bg-rose-600/70 hover:bg-rose-500 text-white rounded-lg text-[9px] font-black uppercase">${tx('İşten Çıkar')}</button>
                                        </div>` : `
                                        <p class="text-[9px] text-slate-500 uppercase font-black">${tx('Boş pozisyon')}</p>
                                        <div class="space-y-2">
                                            ${gameState.staffCandidates[role].map(c => `
                                                <div class="flex items-center justify-between bg-slate-950/70 rounded-xl p-2.5 border border-white/5">
                                                    <div>
                                                        <p class="text-[11px] font-bold text-white">${c.name} <span class="text-amber-400 text-[9px] font-black">⭐${c.level}</span></p>
                                                        <p class="text-[9px] text-slate-500">${Math.round(c.wage * 1000)}K €/${tx('hafta')}</p>
                                                    </div>
                                                    <button onclick="hireStaff('${role}', '${c.id}')" class="bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1.5 rounded-lg text-[9px] font-black text-white uppercase">${tx('İşe Al')}</button>
                                                </div>`).join('')}
                                        </div>`}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
            }
        }

        function renderLineupPitch() {
            const pitch = document.getElementById('lineup-pitch'); if(!pitch) return;
            pitch.querySelectorAll('.player-node').forEach(e => e.remove());

            const locs = {
                "Kaleci": [[8, 50]],
                "Defans": [[30, 15], [30, 38], [30, 62], [30, 85]],
                "Orta Saha": [[55, 15], [55, 38], [55, 62], [55, 85]],
                "Forvet": [[80, 35], [80, 65]]
            };
            const colors = { "Kaleci": "#3b82f6", "Defans": "#ef4444", "Orta Saha": "#ec4899", "Forvet": "#f59e0b" };

            let pIdx = 0;
            for (let m in locs) {
                locs[m].forEach(l => {
                    const p = gameState.myTeam.ilk_11[pIdx]; if (!p) return;
                    const div = document.createElement('div');
                    div.className = 'player-node';
                    div.style.left = l[0] + '%'; div.style.top = l[1] + '%';

                    div.onclick = (e) => {
                        e.stopPropagation();
                        openRoleSelector(p, div);
                    };

                    div.innerHTML = `
                        <div class="kit-circle shadow-2xl relative" style="background: ${colors[p.mevkii]}">
                            ${p.ad[0]}
                            <div class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full ${p.enerji < 50 ? 'bg-rose-500' : 'bg-emerald-400'} border border-white flex items-center justify-center text-[7px] text-black font-extrabold">${Math.round(p.enerji)}</div>
                        </div>
                        <div class="info-tag">${p.ad.split(' ')[0]}<span class="role-tag">${p.role}</span></div>`;
                    pitch.appendChild(div); pIdx++;
                });
            }
        }

        function openRoleSelector(player, nodeElement) {
            closeModals();
            const roles = {
                "Kaleci": ["Libero Kaleci", "Geleneksel"],
                "Defans": ["Pasör Stoper", "Kanat Bek", "Çakılı Bek"],
                "Orta Saha": ["Oyun Kurucu", "Dinamo", "Mezzala"],
                "Forvet": ["Sahte 9", "Pivot", "Fırsatçı Golcü"]
            };

            const selector = document.createElement('div');
            selector.id = "role-selector";
            selector.className = "role-modal absolute top-full left-1/2 -translate-x-1/2 mt-2";
            selector.style.minWidth = "150px";

            (roles[player.mevkii] || ["Standart"]).forEach(r => {
                const btn = document.createElement('button');
                btn.textContent = r;
                if(player.role === r) btn.classList.add('active');
                btn.onclick = (e) => {
                    e.stopPropagation();
                    player.role = r;
                    closeModals();
                    render();
                };
                selector.appendChild(btn);
            });
            nodeElement.appendChild(selector);
        }

        function closeModals() {
            const m = document.getElementById('role-selector');
            if(m) m.remove();
        }

        window.onload = () => {
            let p = [];
            for(let i=0; i<25; i++) {
                let pos = i===0 ? "Kaleci" : (i<8?"Defans":i<16?"Orta Saha":"Forvet");
                let char = ACADEMY_CHARACTERS[Math.floor(Math.random()*ACADEMY_CHARACTERS.length)];
                p.push(new Player(getRandomName(), pos, 52+Math.random()*18, 5+Math.random()*12, 21 + Math.floor(Math.random() * 8), 75+Math.random()*20, 100, 80, "Standart", char));
            }
            gameState.myTeam = new Team("PYTHON FC", p, 50.0, true);

            const otherTeams = [
                "ASLAN SK", "KARTAL SK", "KAPLAN SK", "KUZEY SK",
                "ANADOLU SK", "EGE SK", "MARMARA SK"
            ];

            gameState.league = {
                takimlar: [gameState.myTeam, ...otherTeams.map(name => {
                    let opP = [];
                    for(let i=0; i<18; i++) {
                        let pos = i===0 ? "Kaleci" : (i<7?"Defans":i<14?"Orta Saha":"Forvet");
                        opP.push(new Player(getRandomName(), pos, 48 + Math.random()*16, 0, 24, 82));
                    }
                    return new Team(name, opP, 0);
                })],
                oynananMacSayisi: 0
            };

            for(let i=0; i<15; i++) {
                let pos = ["Kaleci", "Defans", "Orta Saha", "Forvet"][Math.floor(Math.random()*4)];
                gameState.transferPool.push(new Player(getRandomName(), pos, 66 + i, (66+i)*0.22, 20+Math.floor(Math.random()*6), 75 + Math.floor(Math.random()*20)));
            }

            generateAcademyPlayers();
            // === FM v3.0: sezon hedefi + sponsor teklifleri ===
            setSeasonObjective();
            generateSponsorOffers();
            updateWeekIndicator();
            render();
            applyStaticLang();
        };
    </script>
    <!-- WhatsApp kanal yüzen butonu (tüm sayfalarda ortak) -->
    <script src="whatsapp-float.js"></script>
</body>
