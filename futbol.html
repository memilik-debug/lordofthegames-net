                    </div>`;
            } else if (gameState.view === 'academy') {
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto py-4 space-y-6 animate-fade-in">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h2 class="text-2xl font-black italic text-white uppercase flex items-center gap-2">🌱 ALTYAPI & AKADEMİ</h2>
                                <p class="text-xs text-slate-400">Yıldız adayı gençleri gözlemleyin, bireysel eğitip A takıma çıkarın.</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="upgradeAcademyFacilities()" class="bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 px-4 py-2.5 rounded-xl text-xs font-black text-white shadow-md">
                                    Tesisleri Geliştir (${(gameState.academyLevel * 8.5).toFixed(1)}M €)
                                </button>
                                <button onclick="changeView('main_menu')" class="bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl text-xs font-black text-white">ANA MENÜ</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-5 bg-slate-900/60 rounded-2xl border border-white/5 flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] text-slate-500 font-black uppercase">Mevcut Tesis Seviyesi</p>
                                    <p class="text-xl font-black text-teal-400">Derece: Seviye ${gameState.academyLevel} / 5</p>
                                </div>
                                <span class="text-3xl">🏗️</span>
                            </div>
                            <div class="p-5 bg-slate-900/60 rounded-2xl border border-white/5 flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] text-slate-500 font-black uppercase">Yetenek Havuzu Gelişim Katsayısı</p>
                                    <p class="text-xl font-black text-emerald-400">+${gameState.academyLevel * 2.5} Ekstra Taban Yetenek</p>
                                </div>
                                <span class="text-3xl">📈</span>
                            </div>
                        </div>

                        <div class="bg-slate-900/40 p-5 rounded-2xl border border-white/5">
                            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Gözlemci (Scout) Bürosu</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                ${gameState.academyScouts.map(s => `
                                    <div class="bg-slate-950/80 p-4 rounded-xl border border-white/5 flex flex-col justify-between gap-3">
                                        <div>
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-bold text-slate-200">${s.name}</span>
                                                <span class="text-[9px] bg-slate-800 text-amber-400 px-1.5 py-0.5 rounded font-black">${s.region}</span>
                                            </div>
                                            <p class="text-[10px] text-slate-500 mt-1">Gözlem Kalitesi: Seviye ${s.level}</p>
                                        </div>
                                        ${s.hired ?
                                            `<span class="text-center text-emerald-400 font-bold text-xs bg-emerald-500/10 py-1 rounded">Aktif Görevde</span>` :
                                            `<button onclick="hireAcademyScout(${s.id})" class="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded text-[10px] font-black uppercase transition-all">İşe Al (${s.cost}M €)</button>`
                                        }
                                    </div>`).join('')}
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${gameState.academyPool.map(p => `
                                <div class="bg-slate-900/40 p-5 rounded-2xl border border-white/5 flex flex-col justify-between gap-4">
                                    <div>
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="text-[9px] bg-teal-500/20 text-teal-400 font-black px-2 py-0.5 rounded-full uppercase border border-teal-500/20">${p.mevkii}</span>
                                            <span class="text-xs text-slate-400 font-bold">${p.yas} Yaş</span>
                                        </div>
                                        <h4 class="text-base font-bold text-white mt-1">${p.ad.replace(' (Altyapı)','')}</h4>

                                        <div class="mt-4 space-y-1 bg-slate-950/40 p-3 rounded-lg border border-white/5">
                                            <div class="flex justify-between text-xs"><span class="text-slate-400">Karakter</span><span class="font-bold text-slate-200">${p.karakter}</span></div>
                                            <div class="flex justify-between text-xs"><span class="text-slate-400">Yetenek</span><span class="font-bold text-teal-400">${p.yetenek}</span></div>
                                            <div class="flex justify-between text-xs"><span class="text-slate-400">Potansiyel</span><span class="font-bold text-amber-400">${p.potansiyel}</span></div>
                                        </div>
                                    </div>

                                    <div class="space-y-2">
                                        <button onclick="trainIndividualYouth('${p.ad}')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-black text-[10px] uppercase rounded-lg transition-all">Özel Antrenman (0.8M €)</button>
                                        <button onclick="promoteYouthToPro('${p.ad}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-[10px] uppercase rounded-lg transition-all shadow-md">A TAKIMA YÜKSELT (1.5M €)</button>
                                    </div>
                                </div>`).join('')}
                        </div>
                    </div>`;
            } else if (gameState.view === 'training') {
                const trRightStyle = gameState.trainingRights > 0 ? "text-emerald-400 bg-emerald-500/10 border-emerald-500/20" : "text-rose-400 bg-rose-500/10 border-rose-500/20";

                container.innerHTML = `
                    <div class="max-w-4xl mx-auto py-4 space-y-6 animate-fade-in">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h2 class="text-2xl font-black italic text-white uppercase">🏋️‍♂️ TAKIMSAL ANTRENMAN MERKEZİ</h2>
                                <p class="text-xs text-slate-400">Gelişim programları uygulayın, form ile enerji dengesini koruyun.</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="px-3 py-1.5 rounded-lg border text-xs font-black uppercase ${trRightStyle}">
                                    Antrenman Hakkı: ${gameState.trainingRights}/1 ${gameState.trainingRights > 0 ? 'Mevcut' : 'Tükendi (Maç Oynanmalı)'}
                                </div>
                                <button onclick="changeView('main_menu')" class="bg-slate-800 hover:bg-slate-700 px-6 py-2.5 rounded-xl text-xs font-black text-white">GERİ DÖN</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <button onclick="executeTrainingRegime('hucum')" class="p-4 bg-slate-900/60 rounded-2xl border border-white/5 flex flex-col items-center text-center hover:border-pink-500/40 transition-all gap-2">
                                <span class="text-3xl">🏹</span>
                                <h4 class="text-xs font-black text-white uppercase">Hücum & Şut</h4>
                                <p class="text-[9px] text-slate-500">Forvetleri ve bitiriciliği geliştirir.</p>
                                <span class="text-[8px] bg-rose-500/10 text-rose-400 font-bold px-1.5 py-0.5 rounded mt-2">⚡ -22 Enerji</span>
                            </button>
                            <button onclick="executeTrainingRegime('savunma')" class="p-4 bg-slate-900/60 rounded-2xl border border-white/5 flex flex-col items-center text-center hover:border-rose-500/40 transition-all gap-2">
                                <span class="text-3xl">🛡️</span>
                                <h4 class="text-xs font-black text-white uppercase">Savunma & Pres</h4>
                                <p class="text-[9px] text-slate-500">Defansların yeteneğini geliştirir.</p>
                                <span class="text-[8px] bg-rose-500/10 text-rose-400 font-bold px-1.5 py-0.5 rounded mt-2">⚡ -20 Enerji</span>
                            </button>
                            <button onclick="executeTrainingRegime('taktik')" class="p-4 bg-slate-900/60 rounded-2xl border border-white/5 flex flex-col items-center text-center hover:border-indigo-500/40 transition-all gap-2">
                                <span class="text-3xl">🧩</span>
                                <h4 class="text-xs font-black text-white uppercase">Taktik & Pas</h4>
                                <p class="text-[9px] text-slate-500">Orta sahaları ve pas kalitesini uçurur.</p>
                                <span class="text-[8px] bg-rose-500/10 text-rose-400 font-bold px-1.5 py-0.5 rounded mt-2">⚡ -15 Enerji</span>
                            </button>
                            <button onclick="executeTrainingRegime('kondisyon')" class="p-4 bg-slate-900/60 rounded-2xl border border-white/5 flex flex-col items-center text-center hover:border-amber-500/40 transition-all gap-2">
                                <span class="text-3xl">🏃‍♂️</span>
                                <h4 class="text-xs font-black text-white uppercase">Kondisyon</h4>
                                <p class="text-[9px] text-slate-500">Tüm takımın form seviyesini yükseltir.</p>
                                <span class="text-[8px] bg-rose-500/10 text-rose-400 font-bold px-1.5 py-0.5 rounded mt-2">⚡ -18 Enerji</span>
                            </button>
                            <button onclick="executeTrainingRegime('dinlenme')" class="p-4 bg-emerald-950/35 rounded-2xl border border-emerald-500/20 flex flex-col items-center text-center hover:border-emerald-500/40 transition-all gap-2">
                                <span class="text-3xl">💤</span>
                                <h4 class="text-xs font-black text-emerald-400 uppercase">Dinlenme</h4>
                                <p class="text-[9px] text-slate-500">Oyuncuların enerjisini yeniler.</p>
                                <span class="text-[8px] bg-emerald-500/10 text-emerald-400 font-bold px-1.5 py-0.5 rounded mt-2">⚡ +25 Enerji</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="lg:col-span-2 bg-slate-900/40 rounded-2xl p-5 border border-white/5">
                                <h3 class="text-xs font-black text-slate-400 uppercase mb-4">Grup Kondisyon Takip Raporu</h3>
                                <div class="space-y-2 max-h-[350px] overflow-y-auto pr-2">
                                    ${gameState.myTeam.oyuncular.map(p => `
                                        <div class="flex justify-between items-center p-2.5 bg-slate-950/60 rounded-xl border border-white/5">
                                            <div>
                                                <p class="text-xs font-bold text-slate-200">${p.ad}</p>
                                                <p class="text-[9px] text-slate-500 uppercase font-black">${p.mevkii} • Yetenek: ${p.yetenek} • ${p.karakter}</p>
                                            </div>
                                            <div class="flex gap-4 items-center">
                                                <div class="text-right">
                                                    <p class="text-[10px] text-slate-400">Enerji</p>
                                                    <span class="text-xs font-black ${p.enerji < 45 ? 'text-rose-400' : 'text-emerald-400'}">%${Math.round(p.enerji)}</span>
                                                </div>
                                                <div class="text-right">
                                                    <p class="text-[10px] text-slate-400">Form</p>
                                                    <span class="text-xs font-black text-indigo-400">%${p.form}</span>
                                                </div>
                                            </div>
                                        </div>`).join('')}
                                </div>
                            </div>

                            <div class="bg-slate-900/40 rounded-2xl p-5 border border-white/5 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-xs font-black text-slate-400 uppercase mb-4">Son Antrenman Raporu</h3>
                                    ${gameState.lastTrainingSummary ? `
                                        <div class="space-y-2 bg-slate-950/60 p-4 rounded-xl border border-white/5 max-h-[250px] overflow-y-auto">
                                            <p class="text-[10px] text-emerald-400 font-black tracking-wider uppercase">${gameState.lastTrainingSummary.title}</p>
                                            <div class="divide-y divide-white/5 space-y-2 pt-2">
                                                ${gameState.lastTrainingSummary.items.map(item => `<p class="text-[10px] text-slate-300">${item}</p>`).join('')}
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="text-center py-10 text-slate-500 text-xs font-bold">Henüz antrenman uygulanmadı.</div>
                                    `}
                                </div>
                                <div class="bg-indigo-950/25 p-3 rounded-xl border border-indigo-500/10 text-[10px] text-slate-400 mt-4">
                                    💡 <b>Taktiksel Tavsiye:</b> Maç öncesinde takım enerjinizin en az %85 olduğundan emin olun!
                                </div>
                            </div>
                        </div>
                    </div>`;
            }
        }

        function renderLineupPitch() {
            const pitch = document.getElementById('lineup-pitch'); if(!pitch) return;
            pitch.querySelectorAll('.player-node').forEach(e => e.remove());

            const locs = {
                "Kaleci": [[8, 50]],
                "Defans": [[30, 15], [30, 38], [30, 62], [30, 85]],
                "Orta Saha": [[55, 15], [55, 38], [55, 62], [55, 85]],
                "Forvet": [[80, 35], [80, 65]]
            };
            const colors = { "Kaleci": "#3b82f6", "Defans": "#ef4444", "Orta Saha": "#ec4899", "Forvet": "#f59e0b" };

            let pIdx = 0;
            for (let m in locs) {
                locs[m].forEach(l => {
                    const p = gameState.myTeam.ilk_11[pIdx]; if (!p) return;
                    const div = document.createElement('div');
                    div.className = 'player-node';
                    div.style.left = l[0] + '%'; div.style.top = l[1] + '%';

                    div.onclick = (e) => {
                        e.stopPropagation();
                        openRoleSelector(p, div);
                    };

                    div.innerHTML = `
                        <div class="kit-circle shadow-2xl relative" style="background: ${colors[p.mevkii]}">
                            ${p.ad[0]}
                            <div class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full ${p.enerji < 50 ? 'bg-rose-500' : 'bg-emerald-400'} border border-white flex items-center justify-center text-[7px] text-black font-extrabold">${Math.round(p.enerji)}</div>
                        </div>
                        <div class="info-tag">${p.ad.split(' ')[0]}<span class="role-tag">${p.role}</span></div>`;
                    pitch.appendChild(div); pIdx++;
                });
            }
        }

        function openRoleSelector(player, nodeElement) {
            closeModals();
            const roles = {
                "Kaleci": ["Libero Kaleci", "Geleneksel"],
                "Defans": ["Pasör Stoper", "Kanat Bek", "Çakılı Bek"],
                "Orta Saha": ["Oyun Kurucu", "Dinamo", "Mezzala"],
                "Forvet": ["Sahte 9", "Pivot", "Fırsatçı Golcü"]
            };

            const selector = document.createElement('div');
            selector.id = "role-selector";
            selector.className = "role-modal absolute top-full left-1/2 -translate-x-1/2 mt-2";
            selector.style.minWidth = "150px";

            (roles[player.mevkii] || ["Standart"]).forEach(r => {
                const btn = document.createElement('button');
                btn.textContent = r;
                if(player.role === r) btn.classList.add('active');
                btn.onclick = (e) => {
                    e.stopPropagation();
                    player.role = r;
                    closeModals();
                    render();
                };
                selector.appendChild(btn);
            });
            nodeElement.appendChild(selector);
        }

        function closeModals() {
            const m = document.getElementById('role-selector');
            if(m) m.remove();
        }

        window.onload = () => {
            let p = [];
            for(let i=0; i<25; i++) {
                let pos = i===0 ? "Kaleci" : (i<8?"Defans":i<16?"Orta Saha":"Forvet");
                let char = ACADEMY_CHARACTERS[Math.floor(Math.random()*ACADEMY_CHARACTERS.length)];
                p.push(new Player(getRandomName(), pos, 52+Math.random()*18, 5+Math.random()*12, 21 + Math.floor(Math.random() * 8), 75+Math.random()*20, 100, 80, "Standart", char));
            }
            gameState.myTeam = new Team("PYTHON FC", p, 50.0, true);

            const otherTeams = [
                "ASLAN SK", "KARTAL SK", "KAPLAN SK", "KUZEY SK",
                "ANADOLU SK", "EGE SK", "MARMARA SK"
            ];

            gameState.league = {
                takimlar: [gameState.myTeam, ...otherTeams.map(name => {
                    let opP = [];
                    for(let i=0; i<18; i++) {
                        let pos = i===0 ? "Kaleci" : (i<7?"Defans":i<14?"Orta Saha":"Forvet");
                        opP.push(new Player(getRandomName(), pos, 48 + Math.random()*16, 0, 24, 82));
                    }
                    return new Team(name, opP, 0);
                })],
                oynananMacSayisi: 0
            };

            for(let i=0; i<15; i++) {
                let pos = ["Kaleci", "Defans", "Orta Saha", "Forvet"][Math.floor(Math.random()*4)];
                gameState.transferPool.push(new Player(getRandomName(), pos, 66 + i, (66+i)*0.22, 20+Math.floor(Math.random()*6), 75 + Math.floor(Math.random()*20)));
            }

            generateAcademyPlayers();
            render();
        };
    </script>
    <!-- WhatsApp kanal yüzen butonu (tüm sayfalarda ortak) -->
    <script src="whatsapp-float.js"></script>
</body>
</html>
