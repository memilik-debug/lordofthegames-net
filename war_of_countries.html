<style>
/* ===== HoI-style topographic map styling ===== */
:root {
  --c-player: #3b82f6;
  --c-sari: #eab308;
  --c-kirmizi: #ef4444;
  --c-mor: #a855f7;
  --c-yesil: #22c55e;
  --c-turuncu: #f97316;
}

/* Map canvas background — dark vignette like an old war room table */
.map-canvas {
  background:
    radial-gradient(ellipse at center, #2a2a32 0%, #14141a 60%, #0a0a10 100%);
}

/* Tile base */
.tile {
  position: relative;
  overflow: hidden;
}

/* ===== TERRAIN ===== */
.tile-kara {
  background-color: #9bb86b;
  background-image:
    radial-gradient(circle at 25% 30%, rgba(255,255,255,0.10) 1px, transparent 2px),
    radial-gradient(circle at 70% 70%, rgba(0,0,0,0.09) 1px, transparent 2px),
    linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0.06) 100%);
  background-size: 7px 7px, 9px 9px, 100% 100%;
}

.tile-deniz {
  background-color: #1e466e;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 5px),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.07) 0, rgba(0,0,0,0.07) 1px, transparent 1px, transparent 7px),
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.10), transparent 75%);
}

.tile-sig_deniz {
  background-color: #2d5a82;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0, rgba(255,255,255,0.10) 1px, transparent 1px, transparent 4px),
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.14), transparent 80%);
}

.tile-dag {
  background-color: #7a5a42;
  background-image:
    repeating-linear-gradient(45deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,0.10) 0 1px, transparent 1px 8px),
    radial-gradient(circle at 50% 40%, rgba(255,255,255,0.15), transparent 65%);
}

.tile-orman {
  background-color: #3c6432;
  background-image:
    radial-gradient(circle at 25% 25%, rgba(10,40,10,0.7) 2px, transparent 3px),
    radial-gradient(circle at 75% 75%, rgba(10,30,10,0.7) 2px, transparent 3px),
    radial-gradient(circle at 50% 50%, rgba(140,200,90,0.25) 1.5px, transparent 2.5px);
  background-size: 10px 10px, 11px 11px, 7px 7px;
}

.tile-col {
  background-color: #e6d2aa;
  background-image:
    radial-gradient(circle at 30% 30%, rgba(150,110,40,0.20) 1px, transparent 2px),
    radial-gradient(circle at 70% 70%, rgba(255,255,255,0.20) 1px, transparent 2px);
  background-size: 6px 6px, 5px 5px;
}

.tile-bataklik {
  background-color: #4b5320;
  background-image:
    radial-gradient(circle at 30% 30%, rgba(0,0,0,0.32) 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(140,160,90,0.25) 1.5px, transparent 2.5px),
    radial-gradient(circle at 20% 70%, rgba(70,90,160,0.20) 1.5px, transparent 2.5px);
  background-size: 9px 9px, 7px 7px, 8px 8px;
}

.tile-sehir {
  background-color: #c8b888;
  background-image:
    linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(0,0,0,0.12) 100%),
    radial-gradient(circle at 50% 50%, rgba(180,150,90,0.25) 30%, transparent 60%);
}

/* ===== COUNTRY OWNER TINTS (soft overlay) ===== */
.tile.owner-oyuncu::before { background: var(--c-player); }
.tile.owner-dusman_sari::before { background: var(--c-sari); }
.tile.owner-dusman_kirmizi::before { background: var(--c-kirmizi); }
.tile.owner-tara_mor::before { background: var(--c-mor); }
.tile.owner-yeni_yesil::before { background: var(--c-yesil); }
.tile.owner-yeni_turuncu::before { background: var(--c-turuncu); }

.tile[class*="owner-"]::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.28;
  mix-blend-mode: multiply;
  pointer-events: none;
  z-index: 1;
}

/* Water tiles never get a country tint */
.tile-deniz::before,
.tile-sig_deniz::before { display: none !important; }

/* ===== CITY LABEL ===== */
.city-label {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  background: #f0e9c8;
  color: #1a1a1a;
  border: 1.5px solid #1a1a1a;
  padding: 0 3px;
  font-size: 7px;
  font-weight: 900;
  white-space: nowrap;
  z-index: 25;
  font-family: ui-monospace, monospace;
  box-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  letter-spacing: 0.3px;
}

.city-icon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  pointer-events: none;
  font-size: 18px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.7), 0 0 4px rgba(255,255,255,0.4);
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
}

/* River animation - very subtle shimmer */
@keyframes flow {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -20; }
}
.river-shimmer {
  stroke-dasharray: 6 14;
  animation: flow 6s linear infinite;
}
</style>
