        let surfaceY = 0;
        for (let y = 0; y < WORLD_HEIGHT; y++) {
            const b = world[castleStart]?.[y];
            if (b !== BLOCKS.AIR && b !== BLOCKS.WATER && b !== BLOCKS.LAVA) { surfaceY = y - 1; break; }
        }
        // Kale + yanındaki köy için zemini düzleştir (altı da dolar)
        flattenGround(castleStart - 4, castleStart + 56, surfaceY, BLOCKS.SNOW, BLOCKS.DIRT);
        // Build castle on top of surface
        buildFrozenCastle(castleStart, surfaceY);
        // Build the ally village RIGHT NEXT TO the castle (east side)
        buildAllyVillage(castleStart + 30, surfaceY);

        // Build Baldric's dark fortress far to the west (forest)
        const fortressStart = 150;
        let fSurfaceY = 0;
        for (let y = 0; y < WORLD_HEIGHT; y++) {
            const b = world[fortressStart]?.[y];
            if (b !== undefined && b !== BLOCKS.AIR && b !== BLOCKS.WATER && b !== BLOCKS.LAVA) { fSurfaceY = y - 1; break; }
        }
        flattenGround(fortressStart - 4, fortressStart + 36, fSurfaceY, BLOCKS.GRASS, BLOCKS.DIRT);
        buildBaldricFortress(fortressStart, fSurfaceY);
        // killZombies görevi için kale önüne birkaç keşif zombisi doğur
        for (let i = 0; i < 4; i++) {
            entities.push({ type:'zombie', x:(castleStart - 6 - i * 3) * BLOCK_SIZE, y:(surfaceY - 2) * BLOCK_SIZE,
                w:24, h:48, vx:0, vy:0, hp:20, dir:1 });
        }
        // Spawn player inside castle (next to the throne)
        const throneX = castleStart + Math.floor(28/2);
        player.x = (throneX + 3) * BLOCK_SIZE;
        player.y = (surfaceY - 2) * BLOCK_SIZE;
        player.vx = 0; player.vy = 0;
        player.facing = -1;
        // Clear hostile entities inside the castle
        entities = entities.filter(e => {
            const inCastle = e.x >= castleStart * BLOCK_SIZE && e.x < (castleStart + 28) * BLOCK_SIZE && e.y < surfaceY * BLOCK_SIZE;
            if (inCastle && (e.type === 'zombie' || e.type === 'slime')) return false;
            return true;
        });
        // Start with the talkKing quest
        setActiveQuest(0);
        // Show intro dialog after a brief delay
        setTimeout(() => showMcDialog(STORY.intro, () => {
            questProgress('talkKing', 1);
        }), 500);
    } else {
        // Free mode — classic spawn
        spawnPlayerSafely();
    }
}

// Override the king interaction: when the player right-clicks the king, open dialog
function tryTalkToKing(mx, my) {
    if (!kingEntity || !storyMode) return false;
    if (Math.abs(mx - (kingEntity.x + kingEntity.w/2)) > kingEntity.w + 20) return false;
    if (Math.abs(my - (kingEntity.y + kingEntity.h/2)) > kingEntity.h + 20) return false;
    const pcx = player.x + player.width/2, pcy = player.y + player.height/2;
    if (Math.hypot(pcx - kingEntity.x, pcy - kingEntity.y) > BLOCK_SIZE * 5) return false;
    // Talk
    if (QUESTS[activeQuestIdx]?.id === 'talkKing') {
        showMcDialog(STORY.intro, () => questProgress('talkKing', 1));
    } else if (QUESTS[activeQuestIdx]?.id === 'mineStone') {
        showMcDialog([{ c:'👑', n:'Kral Varran', t:'Önce 10 taş topla yabancı. Kalenin altında bol var.' }]);
    } else if (QUESTS[activeQuestIdx]?.id === 'craftSword') {
        showMcDialog([{ c:'👑', n:'Kral Varran', t:'Bir tahta kılıç yap. Çalışma masasını kullan.' }]);
    } else if (QUESTS[activeQuestIdx]?.id === 'killZombies') {
        showMcDialog([{ c:'👑', n:'Kral Varran', t:'Baldric\'in askerleri (zombiler) geliyor. 3 tanesini yen.' }]);
    } else if (QUESTS[activeQuestIdx]?.id === 'reachBaldric') {
        showMcDialog([{ c:'👑', n:'Kral Varran', t:'Batıya yürü. Baldric\'in karargahı orman bölgesinde.' }]);
    } else if (QUESTS[activeQuestIdx]?.id === 'storyEnd') {
        questProgress('storyEnd', 1);
    } else {
        showMcDialog([
            { c:'👑', n:'Kral Varran', t:'Hikaye bitti yabancı. Şimdi sen serbestsin. Krallık burada — yap ne istersin.' }
        ]);
    }
    return true;
}

// Wire right-click on king (intercept the world right-click flow)
const origMouseDown = window.onmousedown;
window.addEventListener('mousedown', (e) => {
    if (e.button !== 2 || uiState.isOpen || !storyMode) return;
    const mx = e.clientX + camera.x, my = e.clientY + camera.y;
    if (tryTalkToKing(mx, my) || tryTalkToBuddy(mx, my)) {
        e.stopImmediatePropagation();
        e.preventDefault();
    }
}, true);

generateWorld();
worlds[0] = world;
// Don't auto-spawn — wait for start screen
spawnPlayerSafely();
// Hide quest panel by default until story mode begins
document.getElementById('mc-quest-panel').classList.remove('show');

function gameLoop() {
    if (!gameStarted) {
        // Just render world behind start screen
        try { draw(); } catch(e) {}
        requestAnimationFrame(gameLoop);
        return;
    }
    updatePhysics();
    draw();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// ==================== MOBILE CONTROLS ====================
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.innerWidth < 900;
let mobileMode = isTouchDevice;
const mcEl = document.getElementById('mobile-controls');
const mcToggleBtn = document.getElementById('mc-toggle');

function applyMobileMode() {
    if (mobileMode) { mcEl.classList.add('active'); mcToggleBtn.innerText = '🖱️ PC'; }
    else { mcEl.classList.remove('active'); mcToggleBtn.innerText = '📱 Mobil'; }
}
function toggleMobileControls() { mobileMode = !mobileMode; applyMobileMode(); initAudio(); }
applyMobileMode();

// Helper: bind a press-and-hold button to a keys[] entry
function bindHoldButton(id, keyName, onTap) {
    const el = document.getElementById(id);
    if (!el) return;
    const press = (e) => {
        e.preventDefault();
        el.classList.add('pressed');
        if (keyName) keys[keyName] = true;
        initAudio();
        if (onTap) onTap();
    };
    const release = (e) => {
        if (e) e.preventDefault();
        el.classList.remove('pressed');
        if (keyName) keys[keyName] = false;
    };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
}

// Movement buttons
bindHoldButton('mc-left', 'a');
bindHoldButton('mc-right', 'd');
bindHoldButton('mc-jump', 'w');

// Inventory toggle (E equivalent)
document.getElementById('mc-inv').addEventListener('click', (e) => {
    e.preventDefault();
    uiState.isOpen = !uiState.isOpen;
    if(!uiState.isOpen) {
        uiState.mode = 'inventory'; uiState.targetEntity = null;
        if (uiState.draggedItem) { addToInventory(uiState.draggedItem.type, uiState.draggedItem.count); uiState.draggedItem = null; }
        for(let i=0; i<9; i++) { if(craftingGrid[i]) { addToInventory(craftingGrid[i].type, craftingGrid[i].count); craftingGrid[i] = null; } }
        if (furnaceSlots.input) { addToInventory(furnaceSlots.input.type, furnaceSlots.input.count); furnaceSlots.input = null; }
        if (furnaceSlots.fuel) { addToInventory(furnaceSlots.fuel.type, furnaceSlots.fuel.count); furnaceSlots.fuel = null; }
        if (furnaceSlots.result) { addToInventory(furnaceSlots.result.type, furnaceSlots.result.count); furnaceSlots.result = null; }
        checkCrafting();
    }
});
document.getElementById('mc-hotbar-prev').addEventListener('click', (e) => {
    e.preventDefault();
    selectedHotbar = (selectedHotbar + 8) % 9;
});
document.getElementById('mc-hotbar-next').addEventListener('click', (e) => {
    e.preventDefault();
    selectedHotbar = (selectedHotbar + 1) % 9;
});

// Mine button: press-hold left-click on world relative to player.
// While held, isMining = true and we redirect aim to a forward-facing block.
const mineBtn = document.getElementById('mc-mine');
const placeBtn = document.getElementById('mc-place');

function aimForward(distBlocks) {
    // Target = block in front of player (uses player.facing)
    const dx = (player.facing || 1) * distBlocks * BLOCK_SIZE;
    const targetWorldX = player.x + player.width/2 + dx;
    const targetWorldY = player.y + player.height/2;
    uiState.mouseX = targetWorldX - camera.x;
    uiState.mouseY = targetWorldY - camera.y;
}

function startMobileMine(e) {
    if (e) e.preventDefault();
    if (uiState.isOpen) return;
    mineBtn.classList.add('pressed');
    aimForward(1);
    isMining = true;
    initAudio();
}
function stopMobileMine(e) {
    if (e) e.preventDefault();
    mineBtn.classList.remove('pressed');
    isMining = false;
    mineTarget.progress = 0;
}
mineBtn.addEventListener('touchstart', startMobileMine, { passive: false });
mineBtn.addEventListener('touchend', stopMobileMine, { passive: false });
mineBtn.addEventListener('touchcancel', stopMobileMine, { passive: false });
mineBtn.addEventListener('mousedown', startMobileMine);
mineBtn.addEventListener('mouseup', stopMobileMine);
mineBtn.addEventListener('mouseleave', stopMobileMine);

// Place button: triggers a single right-click-style place at forward block
function mobilePlace(e) {
    if (e) e.preventDefault();
    if (uiState.isOpen) return;
    placeBtn.classList.add('pressed');
    setTimeout(() => placeBtn.classList.remove('pressed'), 100);
    initAudio();
    aimForward(1);
    // Emulate right click using existing logic
    const evt = new MouseEvent('mousedown', { button: 2, clientX: uiState.mouseX, clientY: uiState.mouseY });
    Object.defineProperty(evt, 'button', { value: 2 });
    window.dispatchEvent(evt);
}
placeBtn.addEventListener('touchstart', mobilePlace, { passive: false });
placeBtn.addEventListener('click', mobilePlace);

// Eat button: aim at self, simulate right click eat
document.getElementById('mc-eat').addEventListener('click', (e) => {
    e.preventDefault();
    if (uiState.isOpen) return;
    initAudio();
    uiState.mouseX = player.x + player.width/2 - camera.x;
    uiState.mouseY = player.y + player.height/2 - camera.y;
    const evt = new MouseEvent('mousedown', { button: 2, clientX: uiState.mouseX, clientY: uiState.mouseY });
    Object.defineProperty(evt, 'button', { value: 2 });
    window.dispatchEvent(evt);
});

// Touch on canvas: track for mining target + inventory drag
canvas.addEventListener('touchstart', (e) => {
    if (e.touches && e.touches.length) {
        const t = e.touches[0];
        uiState.mouseX = t.clientX;
        uiState.mouseY = t.clientY;
        // If inventory open, simulate left click for drag-drop
        if (uiState.isOpen) {
            const evt = new MouseEvent('mousedown', { button: 0, clientX: t.clientX, clientY: t.clientY });
            Object.defineProperty(evt, 'button', { value: 0 });
            window.dispatchEvent(evt);
        }
    }
    e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches.length) {
        const t = e.touches[0];
        uiState.mouseX = t.clientX;
        uiState.mouseY = t.clientY;
    }
    e.preventDefault();
}, { passive: false });

// Hotbar slot direct-tap: tap on bottom hotbar selects slot
canvas.addEventListener('touchend', (e) => {
    if (e.changedTouches && e.changedTouches.length) {
        const t = e.changedTouches[0];
        // Hotbar lives near bottom-center — detect taps there
        const hotbarH = 50;
        const hotbarY = canvas.height - hotbarH - 8;
        if (t.clientY > hotbarY && t.clientY < hotbarY + hotbarH) {
            const slotW = 50;
            const totalW = slotW * 9;
            const startX = (canvas.width - totalW) / 2;
            if (t.clientX >= startX && t.clientX <= startX + totalW) {
                const idx = Math.floor((t.clientX - startX) / slotW);
                if (idx >= 0 && idx < 9) selectedHotbar = idx;
            }
        }
    }
}, { passive: false });
